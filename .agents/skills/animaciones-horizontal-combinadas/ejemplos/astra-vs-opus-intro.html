<style>

/* =====================================================================
   PALETA: base oscura del canal + un color por bando.
   .lado-a / .lado-b / .lado-n definen --c (color), --rgb (el mismo en r,g,b), --c2 (claro) y --c3 (muy claro).
   Cambia los valores por los colores de marca de lo que se compare (references/diseno.md).
   ===================================================================== */
:root{
  --bg:#0a0c10; --text:#eef1f7; --text2:#d5dae4; --muted:#98a1b3; --label:#8d97ab;
  --gold:#E9C46A; --green:#3ddc84; --red:#ec6a5e;
  --grad1:#E8906F; --grad2:#86A3FF;                       /* degradado de la palabra clave del título */
  --card-b:#252932; --chip-bg:#12151c; --chip-b:#2a2f3a;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sans:'Outfit',system-ui,sans-serif;
}
.lado-a{--c:#D97757;--rgb:217,119,87;--c2:#EE9A7A;--c3:#F4B79E}      /* ej.: Claude / Anthropic */
.lado-b{--c:#7C9CFF;--rgb:124,156,255;--c2:#A5BAFF;--c3:#C8D5FF}     /* ej.: OpenAI */
.lado-n{--c:#3e6ef2;--rgb:62,110,242;--c2:#6f8ff0;--c3:#a8bcfe}      /* neutro: azul del canal */
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050608;overflow:hidden}
#viewport{position:absolute;left:0;right:0;top:0;bottom:56px;display:flex;align-items:center;justify-content:center}
body.render #viewport{bottom:0;align-items:flex-start;justify-content:flex-start}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg);font-family:var(--sans);color:var(--text);flex:none}

/* fondo */
#grid{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(160,176,214,.15) 1.3px,transparent 1.9px);background-size:36px 36px;
  -webkit-mask-image:radial-gradient(ellipse 72% 72% at 50% 48%,#000 30%,transparent 100%);mask-image:radial-gradient(ellipse 72% 72% at 50% 48%,#000 30%,transparent 100%)}
.glow{position:absolute;left:0;top:0;width:1500px;height:1500px;border-radius:50%;background:radial-gradient(closest-side,rgba(var(--rgb),.22),rgba(var(--rgb),.065) 52%,transparent 100%)}
#glowN{--rgb:78,108,220}
#vignette{position:absolute;inset:0;background:radial-gradient(ellipse 85% 82% at 50% 50%,transparent 58%,rgba(0,0,0,.5) 100%);pointer-events:none}
#noise{position:absolute;inset:0;opacity:.04;pointer-events:none}
#world{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:960px 540px}
#wires{position:absolute;left:0;top:0;z-index:2;overflow:visible}

.L{position:absolute;left:0;top:0;visibility:hidden}
.z1{z-index:1}.z2{z-index:2}.z3{z-index:3}.z4{z-index:4}.z5{z-index:5}.z6{z-index:6}.z7{z-index:7}.z8{z-index:8}

/* títulos */
.eyebrow{font-family:var(--mono);font-size:24px;font-weight:500;letter-spacing:.22em;color:var(--label);white-space:nowrap}
.title{font-weight:800;font-size:106px;letter-spacing:-.03em;line-height:1.08;white-space:nowrap;color:var(--text)}
.title .ch{display:inline-block}
.title .ch.grad{color:transparent;-webkit-background-clip:text;background-clip:text;background-image:linear-gradient(90deg,var(--grad1),var(--grad2))}
.uline{width:150px;height:7px;border-radius:4px;background:linear-gradient(90deg,var(--grad1),var(--grad2))}
.caret-i{display:inline-block;width:.55em;height:1em;margin-left:3px;vertical-align:-4px;background:#aab6d3;opacity:.85}

/* chip de cabecera: texto que se escribe al ritmo de la voz */
.chip{display:flex;align-items:center;gap:16px;height:72px;padding:0 32px 0 26px;border-radius:999px;background:var(--chip-bg);border:1.5px solid var(--chip-b);
  font-family:var(--mono);font-size:30px;font-weight:500;color:#dfe4ee;white-space:nowrap;box-shadow:0 20px 50px -24px rgba(0,0,0,.8)}
.chip .ic{width:32px;height:32px;color:#b7c1da;display:flex;flex:none}
.chip .tx{position:relative;display:flex;align-items:center}
.chip .strike{position:absolute;left:-6px;right:-6px;top:50%;height:3px;margin-top:-1px;border-radius:2px;background:#ec8a70;transform-origin:0 50%;transform:scaleX(0);box-shadow:0 0 10px rgba(236,138,112,.6)}

/* tarjeta de herramienta/modelo: logo + empresa + familia + nombre grande */
.mcard{width:500px;height:300px;border-radius:30px;background:linear-gradient(180deg,#15171e,#0d0f14);border:1.5px solid var(--card-b);box-shadow:0 44px 90px -40px rgba(0,0,0,.9)}
.mcard .hi{position:absolute;inset:-1.5px;border-radius:30px;border:1.5px solid rgba(var(--rgb),.85);
  background:linear-gradient(160deg,rgba(var(--rgb),.17),rgba(var(--rgb),.035) 62%);

.mcard .ltile{position:absolute;left:36px;top:36px;width:88px;height:88px;border-radius:24px;background:#0b0c10;border:1.5px solid rgba(var(--rgb),.5);
  display:flex;align-items:center;justify-content:center;box-shadow:0 14px 40px -16px rgba(var(--rgb),.7);color:var(--c3)}
.mcard .ltile img{width:54px;height:54px;object-fit:contain;display:block}
.mcard .co{position:absolute;right:38px;top:66px;font-family:var(--mono);font-size:19px;font-weight:500;letter-spacing:.16em;color:var(--c3)}
.mcard .fam{position:absolute;left:38px;top:150px;font-size:34px;font-weight:500;color:#9aa3b5;white-space:nowrap}
.mcard .name{position:absolute;left:35px;top:190px;font-size:84px;font-weight:800;letter-spacing:-.03em;line-height:1;color:#f3f5fa;white-space:nowrap;display:flex}
.mcard .name span{display:inline-block}
.mcard .ver{color:var(--c2);margin-left:.2em}

/* nodo de flujo (132x132): caja con icono o logo y etiqueta debajo; el hueco punteado con "+" se rellena */
.nodo{width:132px;height:132px}
.nodo .caja{position:absolute;inset:0;border-radius:32px;background:#0f1117;border:1.5px solid rgba(var(--rgb),.5);display:flex;align-items:center;justify-content:center;
  color:var(--c3);box-shadow:0 20px 50px -20px rgba(var(--rgb),.7)}

.nodo .lbl{position:absolute;left:50%;top:150px;transform:translateX(-50%);font-family:var(--mono);font-size:24px;font-weight:500;color:var(--text2);white-space:nowrap}

/* insignia redonda: "VS" o "=" */
.badge{width:74px;height:74px;border-radius:50%;background:#12151c;border:1.5px solid #343a47;box-shadow:0 16px 40px -14px rgba(0,0,0,.9)}
.badge > *{position:absolute;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.badge .vs{font-weight:800;font-size:28px;color:#f1f3f8;letter-spacing:.02em}
.badge .eq{color:#c3cad8}

/* barras (precios, métricas) */
.track{width:250px;border-radius:22px 22px 6px 6px;border:1.5px dashed #394156;background:rgba(255,255,255,.012)}
.bar{width:250px;border-radius:22px 22px 6px 6px;overflow:hidden;background:linear-gradient(180deg,var(--c2),rgba(var(--rgb),.75));box-shadow:0 30px 80px -30px rgba(var(--rgb),.8)}
.bar .price{position:absolute;left:0;right:0;top:24px;text-align:center;font-weight:800;font-size:52px;color:#fff;letter-spacing:-.01em;white-space:nowrap}
.bar .pcap{position:absolute;left:0;right:0;top:88px;text-align:center;font-family:var(--mono);font-size:19px;color:rgba(255,255,255,.85);letter-spacing:.06em;white-space:nowrap}
.bar .mark{position:absolute;left:0;right:0;border-top:2.5px dashed rgba(255,255,255,.8);opacity:0}
.bar .shine{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0) 60%);opacity:0}
.baseline{height:2px;border-radius:1px;background:#2f3544}
.nota{height:62px;padding:0 28px 0 24px;border-radius:999px;background:#0d0f14;border:1.5px solid #5a6276;display:flex;align-items:center;gap:12px;
  font-family:var(--mono);font-size:29px;font-weight:500;color:#eef1f7;white-space:nowrap;box-shadow:0 14px 34px -14px rgba(0,0,0,.9)}
.nota b{font-family:var(--sans);font-weight:800;font-size:40px;color:var(--c2)}
.pulse{border-style:solid}

/* intro: bocadillo del pasado, salto, hueco del rival, corona, escenarios */
.bubble{width:660px;height:204px;border-radius:30px;background:linear-gradient(180deg,#171a22,#101218);border:1.5px solid #2e3441;box-shadow:0 40px 90px -40px rgba(0,0,0,.9)}
.bubble .tail{position:absolute;left:84px;bottom:-17px;width:34px;height:34px;background:#101218;border-right:1.5px solid #2e3441;border-bottom:1.5px solid #2e3441;transform:rotate(45deg);border-radius:0 0 8px 0}
.bubble .tag{position:absolute;left:34px;top:28px;display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:22px;font-weight:500;color:#8d97ab;letter-spacing:.06em;opacity:0}
.bubble .dots{position:absolute;left:36px;top:124px;display:flex;gap:12px}
.bubble .dots i{width:16px;height:16px;border-radius:50%;background:#8a94a8}
.bubble .q{position:absolute;left:34px;right:30px;top:92px;font-size:54px;font-weight:800;letter-spacing:-.02em;color:#d3d8e2;white-space:nowrap}
.bubble .strike{position:absolute;left:24px;right:24px;top:124px;height:7px;border-radius:4px;background:#ec6a5e;transform-origin:0 50%;transform:scaleX(0);box-shadow:0 0 18px rgba(236,106,94,.75)}
.linea{width:7px;height:0;border-radius:4px;background:linear-gradient(180deg,rgba(238,154,122,.85),rgba(217,119,87,0))}
.flecha{color:#EE9A7A}
.hueco{width:500px;height:300px}
.hueco svg{position:absolute;left:0;top:0;overflow:visible}
.hueco .hl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.corona{display:flex;align-items:center;gap:12px;height:64px;padding:0 28px 0 22px;border-radius:999px;background:rgba(233,196,106,.1);border:1.5px solid rgba(233,196,106,.6);
  color:#F3D78B;font-family:var(--mono);font-size:26px;font-weight:600;white-space:nowrap;box-shadow:0 0 44px -10px rgba(233,196,106,.55)}
.slot{width:320px;height:300px}
.slot svg{position:absolute;left:0;top:0;overflow:visible}
.slot .snum{position:absolute;left:0;right:0;top:50%;margin-top:-28px;text-align:center;font-family:var(--mono);font-size:46px;font-weight:600;color:#3b4354;letter-spacing:.04em}
.scard{width:320px;height:300px;border-radius:28px;background:linear-gradient(180deg,#15171e,#0d0f14);border:1.5px solid var(--card-b);box-shadow:0 40px 80px -40px rgba(0,0,0,.9)}
.scard .hi{position:absolute;inset:-1.5px;border-radius:28px;border:1.5px solid rgba(var(--rgb),.8);background:linear-gradient(160deg,rgba(var(--rgb),.14),rgba(var(--rgb),.03) 62%);
  box-shadow:0 0 0 1px rgba(var(--rgb),.18),0 30px 90px -30px rgba(var(--rgb),.6);opacity:0}
.scard .num{position:absolute;left:24px;top:20px;font-family:var(--mono);font-size:22px;font-weight:600;color:#6b7488;letter-spacing:.06em}
.scard .tile{position:absolute;left:50%;top:58px;width:112px;height:112px;margin-left:-56px;border-radius:30px;background:#0b0c10;border:1.5px solid rgba(var(--rgb),.45);
  display:flex;align-items:center;justify-content:center;color:#dfe6f7;box-shadow:0 18px 50px -18px rgba(var(--rgb),.75)}
.scard .tt{position:absolute;left:0;right:0;top:192px;text-align:center;font-size:35px;font-weight:800;letter-spacing:-.02em;color:#f3f5fa;white-space:nowrap}
.scard .duel{position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:center;align-items:center;gap:12px;font-family:var(--mono);font-size:16px;color:#7d869a}
.scard .ok{position:absolute;right:16px;top:14px;width:40px;height:40px;border-radius:50%;background:#123524;border:1.5px solid #3ddc84;color:#3ddc84;
  display:flex;align-items:center;justify-content:center;opacity:0;box-shadow:0 0 18px rgba(61,220,132,.45)}

/* controles de previsualización (no salen en el render) */
#controls{position:fixed;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 18px;background:#0a0c10;border-top:1px solid #1e2129;
  font-family:var(--mono);color:var(--muted);font-size:13px}
#controls button{width:38px;height:34px;border-radius:8px;border:1px solid #2b303d;background:#141a2c;color:#cfdbff;font-size:15px;cursor:pointer}
#controls input{flex:1;accent-color:#7C9CFF}
#controls .t{min-width:110px;text-align:right}
body.render #controls{display:none}
</style>

<body>
<div id="viewport">
  <div id="stage">
    <div id="grid"></div>
    <div id="glowN" class="glow"></div>
    <div id="glowA" class="glow lado-a"></div>
    <div id="glowB" class="glow lado-b"></div>
    <div id="world">
      <svg id="wires" width="1920" height="1080" viewBox="0 0 1920 1080">
        <defs><radialGradient id="dotHalo"><stop offset="0" stop-color="#9db4ff" stop-opacity=".65"/><stop offset="1" stop-color="#9db4ff" stop-opacity="0"/></radialGradient></defs>
        <g id="wiresG"></g><g id="dotsG"></g>
      </svg>
    </div>
    <div id="vignette"></div>
    <div id="noise"></div>
  </div>
</div>
<div id="controls">
  <button id="play" title="Reproducir / pausa (espacio)">▶</button>
  <input id="scrub" type="range" min="0" max="10" step="0.01" value="0">
  <span class="t" id="tlabel">0.00 s</span>
</div>
<audio id="audio" preload="auto"></audio>

<script>
'use strict';
/* =====================================================================
   Motor de animación: cada fotograma es una función pura de t (segundos).
   render(t) coloca todo; render.mjs captura t = fotograma / FPS y ffmpeg añade la voz.
   Nada depende del fotograma anterior: se puede renderizar en paralelo y saltar a cualquier t.
   ===================================================================== */
const CONFIG = { dur: 41.0, audio: '', ancho: 1920, alto: 1080 };   // «anim.py nuevo» rellena dur y audio
const CX = CONFIG.ancho / 2, CY = CONFIG.alto / 2;
const Q = new URLSearchParams(location.search);
const RENDER = Q.has('render');
if (RENDER) document.body.classList.add('render');

/* ---------- Guion: inicio de cada palabra clave (de trabajo/tiempos.json, en segundos) ----------
   Un visual entra 0,02–0,05 s antes de su palabra. Ejemplo: T.opus = 4.64 -> la tarjeta arranca en T.opus - .04 */
const T = {
  // ESTIMADOS desde las marcas de la transcripción (trabajo/tiempos.json, ±0,3–0,5 s dentro de cada frase)
  probando: .72, durante: 1.16, estos: 1.59, dias: 1.87, opus1: 2.02, v55: 2.31, comer: 3.89, palabras: 4.32,
  videos: 5.32, anteriores: 5.65, decia: 6.32, opus2: 6.82, tanto: 8.32,
  realidad: 10.2, esta: 11.15, si: 11.65, tenemos: 11.98, pega: 13.32, un: 13.65, salto: 13.82, importante: 14.15, importanteFin: 14.82,
  por: 16.15, decidido: 16.82, enfrentarlo: 17.48, contra: 18.15, mejor: 18.65, openai: 19.65, gpt: 20.31, astra: 20.48,
  en5: 22.15, cinco: 22.31, escenarios: 22.64, completamente: 23.29, diferentes: 24.10,
  edicion: 25.15, video: 25.82, creacion: 26.31, animaciones: 26.81,
  desarrollo: 28.15, aplicaciones: 28.98,
  programacion: 31.15, videojuegos: 31.98,
  no: 33.15, una: 33.77, simple: 34.01, comparacion: 34.26, comparacionFin: 34.75,
  casos: 35.82, de2: 36.15, uso: 36.32, reales: 36.65, realesFin: 36.98, aplicar: 37.48, desde: 37.98, ya: 38.32, yaFin: 38.48,
};

window.__T = T;   // tools/comprobar.mjs --palabras saca un fotograma del MP4 en cada uno

/* ---------- utilidades ---------- */
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, p) => a + (b - a) * p;
const E = {
  lin: p => p,
  out2: p => 1 - (1 - p) * (1 - p),
  out3: p => 1 - Math.pow(1 - p, 3),
  out4: p => 1 - Math.pow(1 - p, 4),
  in2: p => p * p,
  in3: p => p * p * p,
  io3: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  io4: p => p < .5 ? 8 * p * p * p * p : 1 - Math.pow(-2 * p + 2, 4) / 2,
  ioSine: p => -(Math.cos(Math.PI * p) - 1) / 2,
  outExpo: p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p),
  back: p => { const s = 1.70158; return 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2); },
  spring: p => p >= 1 ? 1 : 1 - Math.exp(-6.5 * p) * Math.cos(10.5 * p),
};
/* progreso 0..1 de una animación que empieza en t0 y dura d, con curva e */
const P = (t, t0, d, e = E.out3) => e(clamp((t - t0) / d));
/* 0 -> 1 -> 0 (seno) entre t0 y t0+d: golpes de escala, parpadeos */
const bump = (t, t0, d) => (t < t0 || t > t0 + d) ? 0 : Math.sin(Math.PI * (t - t0) / d);
/* destello: sube en rise s y cae exponencialmente */
const flash = (t, t0, rise = .08, decay = 3.2) => t < t0 ? 0 : t < t0 + rise ? (t - t0) / rise : Math.exp(-(t - t0 - rise) * decay);
const blink = (t, hz = 2.2) => (Math.floor(t * hz * 2) % 2 === 0) ? 1 : 0;
/* muelle amortiguado: respuesta a un escalón (0 -> 1, con rebote) y a un golpe (0 -> ±1 -> 0) */
function step(tau, w = 9, z = .35) {
  if (tau <= 0) return 0;
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * tau) * (Math.cos(wd * tau) + (z * w / wd) * Math.sin(wd * tau));
}
function impulse(tau, w = 10, z = .3) {
  if (tau <= 0) return 0;
  const wd = w * Math.sqrt(1 - z * z);
  return Math.exp(-z * w * tau) * Math.sin(wd * tau);
}
/* fotogramas clave: [[t, {props}, curva], ...]. norm() rellena lo que falte con el fotograma anterior
   (KF solo interpola las propiedades presentes en cada fotograma: sin norm() se pierden). */
function norm(keys) {
  let prev = {};
  return keys.map(([t, v, e]) => { const full = { ...prev, ...v }; prev = full; return e ? [t, full, e] : [t, full]; });
}
function KF(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const [t1, v1, e = E.io3] = keys[i], [t0, v0] = keys[i - 1];
    if (t < t1) {
      const p = e(clamp((t - t0) / (t1 - t0))), o = {};
      for (const k in v1) o[k] = lerp(v0[k] ?? v1[k], v1[k], p);
      return o;
    }
  }
  return keys[keys.length - 1][1];
}
const mix = (a, b, p) => `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], p))).join(',')})`;

const $ = id => document.getElementById(id);
const STAGE = $('stage'), WORLD = $('world'), WIRES = $('wiresG'), DOTS = $('dotsG');
const SVGNS = 'http://www.w3.org/2000/svg';

function mk(tag, cls, parent, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  (parent || WORLD).appendChild(e);
  return e;
}

/* coloca un elemento de primer nivel. x,y = punto de anclaje (por defecto el centro; ax/ay en %)
   o = opacidad, s/sx/sy = escala, r = giro, ry = giro 3D en Y (volteo de carta), b = desenfoque px,
   g = escala de grises 0..1, br = brillo. Con o ≈ 0 lo oculta (visibility hidden). */
function put(e, o) {
  const op = o.o ?? 1;
  if (!(op > 0.002)) { if (e._v !== 0) { e.style.visibility = 'hidden'; e.style.opacity = 0; e._v = 0; } return; }
  if (e._v !== 1) { e.style.visibility = 'visible'; e._v = 1; }
  const ax = o.ax ?? 50, ay = o.ay ?? 50;
  let tr = `translate(${o.x.toFixed(2)}px,${o.y.toFixed(2)}px) translate(${-ax}%,${-ay}%)`;
  if (o.ry) tr += ` perspective(1600px) rotateY(${o.ry.toFixed(3)}deg)`;
  if (o.r) tr += ` rotate(${o.r.toFixed(3)}deg)`;
  const s = o.s ?? 1, sx = (o.sx ?? 1) * s, sy = (o.sy ?? 1) * s;
  if (sx !== 1 || sy !== 1) tr += ` scale(${sx.toFixed(4)},${sy.toFixed(4)})`;
  e.style.transform = tr;
  e.style.transformOrigin = `${ax}% ${ay}%`;
  e.style.opacity = op.toFixed(4);
  const f = [], b = o.b ?? 0, g = o.g ?? 0, br = o.br ?? 1;
  if (b > 0.05) f.push(`blur(${b.toFixed(2)}px)`);
  if (g > 0.005) f.push(`grayscale(${g.toFixed(3)})`);
  if (Math.abs(br - 1) > 0.005) f.push(`brightness(${br.toFixed(3)})`);
  e.style.filter = f.length ? f.join(' ') : 'none';
}
const off = e => put(e, { o: 0 });

/* icon(nombre, tamaño, grosor) -> HTML del SVG. Con dibujable = true cada trazo lleva pathLength=1
   y se puede "dibujar" con drawStrokes(svg, progreso) (el svg es el elemento ya insertado). */
function icon(name, size, sw = 2, dibujable = false) {
  if (!ICON[name]) console.error('icono desconocido: ' + name);
  const inner = dibujable ? (ICON[name] || '').replace(/<(path|circle|rect|line|polyline|polygon|ellipse)\b/g, '<$1 pathLength="1"') : (ICON[name] || '');
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" style="display:block;overflow:visible">${inner}</svg>`;
}
/* dibuja los trazos de un SVG con pathLength=1. stagger = desfase entre trazos (0..1) */
function drawStrokes(svg, p, stagger = 0) {
  const parts = svg._parts || (svg._parts = [...svg.querySelectorAll('[pathLength]')]);
  const n = parts.length, span = 1 - (n - 1) * stagger;
  for (let i = 0; i < n; i++) {
    const q = stagger ? clamp((p - i * stagger) / span) : p;
    parts[i].style.strokeDasharray = q >= 1 ? 'none' : '1 2';
    parts[i].style.strokeDashoffset = (1 - q).toFixed(4);
    parts[i].style.opacity = q > 0.002 ? 1 : 0;
  }
}
/* ---------- logos: <img data-logo="slug">. Al arrancar se lee assets/logos/logos.json (anim.py logos) ---------- */
/* crea las piezas al principio del archivo (no dentro de render): así el arranque espera a que sus logos carguen */
let LOGOS = null;   // registro de logos.json, cargado al arrancar
const logo = (slug, size = 54) => {
  const f = LOGOS && LOGOS[slug] ? ` src="assets/logos/${LOGOS[slug].file.split('/').pop()}"` : '';
  return `<img data-logo="${slug}"${f} width="${size}" height="${size}" alt="" style="width:${size}px;height:${size}px;object-fit:contain;display:block">`;
};

/* ---------- conectores discontinuos y paquetes que viajan por ellos ---------- */
class Wire {
  constructor(pts, o = {}) {
    this.el = document.createElementNS(SVGNS, 'path');
    this.el.setAttribute('fill', 'none');
    this.el.setAttribute('stroke', o.color || '#4a5266');
    this.el.setAttribute('stroke-width', o.width || 2);
    this.el.setAttribute('stroke-linecap', 'round');
    if (o.dash !== null) this.el.setAttribute('stroke-dasharray', o.dash || '7 9');
    if (!o.hidden) WIRES.appendChild(this.el);
    this.set(pts);
  }
  set(pts) {
    this.pts = pts; this.seg = []; this.L = 0;
    for (let i = 1; i < pts.length; i++) {
      const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
      this.seg.push(l); this.L += l;
    }
  }
  at(f) {   // punto en la fracción f del recorrido
    let d = clamp(f) * this.L;
    for (let i = 0; i < this.seg.length; i++) {
      if (d <= this.seg[i] || i === this.seg.length - 1) {
        const p = this.seg[i] ? clamp(d / this.seg[i]) : 0, a = this.pts[i], b = this.pts[i + 1];
        return [lerp(a[0], b[0], p), lerp(a[1], b[1], p)];
      }
      d -= this.seg[i];
    }
  }
  sub(a, b) {
    const A0 = a * this.L, B0 = b * this.L, out = [];
    let acc = 0;
    for (let i = 0; i < this.seg.length; i++) {
      const s0 = acc, s1 = acc + this.seg[i]; acc = s1;
      if (s1 < A0 || s0 > B0 || !this.seg[i]) continue;
      const p0 = clamp((A0 - s0) / this.seg[i]), p1 = clamp((B0 - s0) / this.seg[i]);
      const a0 = this.pts[i], b0 = this.pts[i + 1];
      if (!out.length) out.push(`M${lerp(a0[0], b0[0], p0).toFixed(2)} ${lerp(a0[1], b0[1], p0).toFixed(2)}`);
      out.push(`L${lerp(a0[0], b0[0], p1).toFixed(2)} ${lerp(a0[1], b0[1], p1).toFixed(2)}`);
    }
    return out.join('');
  }
  /* dibuja el tramo [a,b] (fracciones 0..1). flow = desplazamiento de las rayas en px (sensación de flujo) */
  draw(a, b, op = 1, flow = 0) {
    if (b - a <= 0.0005 || op <= 0.002) { this.el.style.opacity = 0; this.el.setAttribute('d', ''); return; }
    this.el.setAttribute('d', this.sub(a, b));
    this.el.style.opacity = op.toFixed(3);
    this.el.style.strokeDashoffset = (a * this.L - flow).toFixed(2);
  }
}
class Dot {
  constructor(r = 5.5, color = '#dbe5ff') {
    this.g = document.createElementNS(SVGNS, 'g');
    const h = document.createElementNS(SVGNS, 'circle'); h.setAttribute('r', r * 3.4); h.setAttribute('fill', 'url(#dotHalo)');
    const c = document.createElementNS(SVGNS, 'circle'); c.setAttribute('r', r); c.setAttribute('fill', color);
    this.g.append(h, c); DOTS.appendChild(this.g); this.g.style.opacity = 0;
  }
  at(x, y, o = 1, s = 1) { this.g.setAttribute('transform', `translate(${x.toFixed(2)} ${y.toFixed(2)}) scale(${s.toFixed(3)})`); this.g.style.opacity = o.toFixed(3); }
  hide() { this.g.style.opacity = 0; }
}
/* paquete que recorre un cable entre t0 y t1 (rev = al revés) */
function travel(dot, wire, t, t0, t1, rev = false, e = E.io3) {
  if (t < t0 || t > t1 + 0.14) { dot.hide(); return; }
  const p = e(clamp((t - t0) / (t1 - t0)));
  const [x, y] = wire.at(rev ? 1 - p : p);
  dot.at(x, y, clamp((t - t0) / 0.07) * (1 - clamp((t - t1) / 0.14)));
}

/* ---------- anillos que se expanden (rect redondeado o círculo) ---------- */
const PULSES = [];
function pulse(t0, dur, x, y, w, h, r, rgb, to, bw = 2) {
  const e = mk('div', 'L pulse z6');
  e.style.width = w + 'px'; e.style.height = h + 'px'; e.style.borderRadius = r + 'px';
  e.style.borderWidth = bw + 'px'; e.style.borderColor = `rgba(${rgb},.95)`;
  PULSES.push({ e, t0, dur, x, y, to });
}
/* anillo alrededor de una tarjeta que se mueve con fotogramas clave (se toma su posición en t0) */
const ringCard = (t0, keys, rgb, to = 1.16, dur = .8) => { const k = KF(t0, keys); pulse(t0, dur, k.x, k.y, 500 * k.s, 300 * k.s, 30 * k.s, rgb, to); };

/* ---------- título letra a letra (palabra clave con degradado) ---------- */
function letters(text, cls, gradWord) {
  const d = mk('div', cls);
  const g0 = gradWord ? text.indexOf(gradWord) : -1, g1 = g0 + (gradWord || '').length;
  d._ch = [...text].map((c, i) => {
    const s = document.createElement('span');
    s.className = 'ch' + (i >= g0 && i < g1 && g0 >= 0 ? ' grad' : '');
    s.textContent = c === ' ' ? ' ' : c;     // espacio duro: un espacio normal en inline-block desaparece
    d.appendChild(s); return s;
  });
  return d;
}
/* tiempos por letra: cada palabra entra con su inicio en la voz (starts = inicio de cada palabra) */
function letterTimes(text, starts, lead = .05, gap = .024) {
  const out = []; let w = 0, k = 0;
  for (const c of text) { if (c === ' ') { out.push(null); w++; k = 0; continue; } out.push((starts[w] ?? starts[starts.length - 1]) - lead + k * gap); k++; }
  return out;
}
function lettersIn(d, t, times, dur = .5) {
  d._ch.forEach((c, i) => {
    const t0 = times[i]; if (t0 == null) return;
    const p = E.out4(clamp((t - t0) / dur));
    c.style.transform = `translateY(${((1 - p) * .42).toFixed(3)}em)`;
    c.style.opacity = clamp((t - t0) / (dur * .52)).toFixed(3);
  });
}
/* degradado continuo en la palabra clave aunque cada letra sea una pieza (llamar en layout()) */
function gradLetters(d) {
  const g = d._ch.filter(c => c.classList.contains('grad'));
  if (!g.length) return;
  const x0 = g[0].offsetLeft, W = g[g.length - 1].offsetLeft + g[g.length - 1].offsetWidth - x0;
  g.forEach(c => { c.style.backgroundSize = `${W}px 100%`; c.style.backgroundPosition = `${-(c.offsetLeft - x0)}px 0`; });
}

/* ---------- chip de cabecera con texto que se escribe al ritmo de la voz ----------
   fases: [{ t0, icono, textos: [[inicio, fin, 'texto'], ...], tachar: t, borrar: [inicio, fin] }]
   pintar(t, {x, y, o}) cada fotograma. */
class ChipEscrito {
  constructor(fases, z = 'z6') {
    this.fases = fases;
    this.el = mk('div', `L chip ${z}`, null, '<span class="ic"></span><span class="tx"><span class="t"></span><span class="caret-i"></span><span class="strike"></span></span>');
    this.ic = this.el.querySelector('.ic'); this.tx = this.el.querySelector('.t');
    this.caret = this.el.querySelector('.caret-i'); this.strike = this.el.querySelector('.strike');
  }
  pintar(t, pos) {
    if (!(pos.o > .002)) { off(this.el); return; }
    let ph = this.fases[0];
    for (const f of this.fases) if (t >= f.t0) ph = f;
    if (this.ph !== ph) {
      this.ic.innerHTML = ph.icono ? icon(ph.icono, 32, 2) : ''; this.ic.style.display = ph.icono ? 'flex' : 'none'; this.ph = ph;
      if (ph._w == null) {   // ancho con el texto completo: el chip no crece mientras se escribe (no se desplaza)
        const pv = this.tx.textContent, cd = this.caret.style.display;
        this.el.style.width = ''; this.tx.textContent = ph.textos.map(x => x[2]).join(''); this.caret.style.display = 'inline-block';
        ph._w = this.el.offsetWidth; this.tx.textContent = pv; this.caret.style.display = cd;
      }
      this.el.style.width = ph._w + 'px';
    }
    let s = '', typing = false;
    for (const [a, b, txt] of ph.textos) {
      const n = Math.floor(clamp((t - a) / (b - a)) * txt.length + (t >= a ? 1 : 0));
      s += txt.slice(0, Math.min(n, txt.length));
      if (t >= a && t < b) typing = true;
    }
    const del = ph.borrar && t > ph.borrar[0];
    if (del) s = s.slice(0, Math.floor(s.length * (1 - P(t, ph.borrar[0], ph.borrar[1] - ph.borrar[0], E.lin))));
    this.tx.textContent = s;
    const last = ph.textos[ph.textos.length - 1][1];
    this.caret.style.display = (typing || (t > ph.t0 && t < last + .7) || del) ? 'inline-block' : 'none';
    this.caret.style.opacity = typing ? 1 : blink(t, 2.4);
    const st = ph.tachar ? P(t, ph.tachar, .36, E.io3) * (ph.borrar ? 1 - P(t, ph.borrar[0] - .1, .1, E.lin) : 1) : 0;
    this.strike.style.transform = `scaleX(${st.toFixed(4)})`;
    this.ic.style.opacity = P(t, ph.t0, .25).toFixed(3);
    put(this.el, pos);
  }
}

/* segmentos para ChipEscrito que escriben cada palabra mientras se dice (no a velocidad fija):
   textos: escribirPalabras('sale muy barato', [T.sale, T.muy, T.barato], T.baratoFin) */
function escribirPalabras(texto, inicios, fin) {
  const ws = texto.split(' ');
  return ws.map((w, i) => {
    const a = inicios[i] - .03, b = (i + 1 < ws.length ? inicios[i + 1] : fin) - .05;
    return [a, Math.max(a + .06, b), (i ? ' ' : '') + w];
  });
}
/* fija el ancho de una pieza cuyo texto se escribe letra a letra (mide el texto completo): no se desplaza al crecer.
   Llamar en layout(). Ej.: anchoFijo(eyebrow, 'LO PRIMERO<span class="caret-i"></span>') */
function anchoFijo(el, html) {
  const prev = el.innerHTML; el.innerHTML = html; const w = el.offsetWidth; el.innerHTML = prev;
  el.style.width = w + 'px'; return w;
}

/* ---------- nodo de flujo (automatizaciones, integraciones, pasos) ----------
   nodo({ lado, logo: 'gmail' | icono: 'inbox', etiqueta: 'fuente' }) -> caja 132x132 con etiqueta debajo.
   nodoEstado(el, { relleno, h, dibujo, etiqueta }): relleno 0 = hueco punteado con "+", 1 = caja llena (entra con rebote);
   h = resalte; dibujo = progreso del trazo del icono (si se creó con icono); etiqueta = opacidad del texto (por
   defecto, la del relleno). Colócalo con put() como cualquier pieza. */
function nodo(o) {
  const e = mk('div', `L nodo lado-${o.lado || 'n'} z3`);
  e._hueco = mk('div', 'hueco', e, icon('plus', 40, 2));
  e._caja = mk('div', 'caja', e, o.logo ? logo(o.logo, 72) : icon(o.icono || 'bot', 60, 1.9, true));
  e._hi = mk('div', 'hi', e);
  e._lbl = mk('div', 'lbl', e, o.etiqueta || '');
  e._svg = e._caja.querySelector('svg');
  return e;
}
function nodoEstado(e, { relleno = 1, h = 0, dibujo = null, etiqueta = relleno } = {}) {
  e._lbl.style.opacity = clamp(etiqueta * 1.6).toFixed(3);   // la etiqueta sale con el relleno (etiqueta: 1 para verla siempre)
  e._hueco.style.opacity = (1 - clamp(relleno * 2)).toFixed(3);
  e._caja.style.opacity = clamp(relleno * 1.6).toFixed(3);
  e._caja.style.transform = `scale(${lerp(.6, 1, E.back(clamp(relleno))).toFixed(4)})`;
  e._hi.style.opacity = clamp(h).toFixed(3);
  if (e._svg && dibujo != null) drawStrokes(e._svg, dibujo, .08);
}
/* lleva una pieza por un cable: progreso p de t0 a t1 (curva e), con el resto de propiedades en extra (o, s...).
   Si los extremos del cable se mueven, actualízalo antes con wire.set([[x,y], ...]). */
function viajar(el, wire, t, t0, t1, extra = {}, e = E.io3) {
  const [x, y] = wire.at(e(clamp((t - t0) / (t1 - t0))));
  put(el, { ...extra, x, y });
}

/* ---------- tarjeta de herramienta / modelo ----------
   tarjeta({ lado: 'a'|'b'|'n', logo: 'claude' (slug de assets/logos) o icono: 'bot', empresa: 'ANTHROPIC',
             familia: 'Claude', nombre: 'Opus', version: '5.5' }). Tamaño base 500x300 (se escala con put s). */
function tarjeta(o) {
  const e = mk('div', `L mcard lado-${o.lado || 'n'} z3`);
  e._hi = mk('div', 'hi', e);
  e._tile = mk('div', 'ltile', e, o.logo ? logo(o.logo, 54) : icon(o.icono || 'sparkles', 46, 2));
  e._co = mk('div', 'co', e, o.empresa || '');
  e._fam = mk('div', 'fam', e, o.familia || '');
  e._name = mk('div', 'name', e, `<span class="nm">${o.nombre}</span>${o.version ? `<span class="ver">${o.version}</span>` : ''}`);
  e._nm = e._name.querySelector('.nm'); e._ver = e._name.querySelector('.ver');
  return e;
}
/* coloca la tarjeta (k = {x,y,s,o,...}) y su resalte h (0..1: borde y brillo de su color) */
function card(e, k, h = 0) { put(e, k); e._hi.style.opacity = clamp(h).toFixed(3); }
/* texto que sube y aparece */
function rise(el, t, t0, d = .42, dy = 16) {
  const p = P(t, t0, d, E.out4);
  el.style.opacity = clamp((t - t0) / (d * .55)).toFixed(3);
  el.style.transform = `translateY(${((1 - p) * dy).toFixed(2)}px)`;
}
/* texto que entra con golpe (grande y desenfocado -> tamaño normal): para nombres que dice la voz */
function slam(el, t, t0, from = 1.4) {
  if (!el) return;
  const r = clamp((t - t0) / .5), p = E.out4(r);
  el.style.opacity = clamp(r * 3.5).toFixed(3);
  el.style.transformOrigin = '0% 75%';
  el.style.transform = `scale(${lerp(from, 1, p).toFixed(4)})`;
  el.style.filter = r > 0 && r < 1 ? `blur(${((1 - p) * 7).toFixed(2)}px)` : 'none';
}
/* insignia "VS" / "=" (vsP 0..1 cruza de "=" a "VS") */
function insignia() {
  const e = mk('div', 'L badge z5', null, `<div class="eq">${icon('equal', 30, 2.4)}</div><div class="vs">VS</div>`);
  e._eq = e.querySelector('.eq'); e._vs = e.querySelector('.vs');
  return e;
}
function badgeState(e, vsP) {
  e._eq.style.opacity = (1 - vsP).toFixed(3);
  e._eq.style.transform = `rotate(${(vsP * 90).toFixed(1)}deg) scale(${(1 - .5 * vsP).toFixed(3)})`;
  e._vs.style.opacity = vsP.toFixed(3);
  e._vs.style.transform = `scale(${lerp(.4, 1, E.back(vsP)).toFixed(3)})`;
}
/* barra de métrica: crece desde la base; el texto solo aparece cuando cabe (sin cifras intermedias) */
function barra(lado, texto, sub = '') {
  const e = mk('div', `L bar lado-${lado} z3`, null, `<div class="price">${texto}</div><div class="pcap">${sub}</div><div class="mark"></div><div class="shine"></div>`);
  e._price = e.querySelector('.price'); e._cap = e.querySelector('.pcap'); e._mark = e.querySelector('.mark'); e._shine = e.querySelector('.shine');
  return e;
}
function crecer(e, t, { x, base, alto, t0, dur = .9 }) {
  const p = P(t, t0, dur, E.out3), h = Math.max(1, alto * p);
  e.style.height = h.toFixed(1) + 'px';
  put(e, { x, y: base, ay: 100, o: p > 0 ? 1 : 0 });
  const tp = clamp((h - 120) / 50);
  e._price.style.opacity = tp.toFixed(3); e._price.style.transform = `translateY(${((1 - tp) * 10).toFixed(2)}px)`;
  e._cap.style.opacity = clamp((h - 150) / 30).toFixed(3);
}

/* =====================================================================

   ===================================================================== */
function render(t) {
  const cam = KF(t, CAMK), dx = -(cam.x - CX) * cam.s, dy = -(cam.y - CY) * cam.s;
  WORLD.style.transform = `translate(${dx.toFixed(2)}px,${dy.toFixed(2)}px) scale(${cam.s.toFixed(5)})`;
  grid.style.opacity = P(t, 0, .5, E.out2).toFixed(3);
  grid.style.backgroundPosition = `${(dx * .3 - t * 4).toFixed(2)}px ${(dy * .3 - t * 2).toFixed(2)}px`;
  const breath = .9 + .1 * Math.sin(t * 1.7);
  const gn = KF(t, GNK), ga = KF(t, GAK), gb = KF(t, GBK);
  const fl = .5 * flash(t, T.salto + .2, .1, 2) + .35 * flash(t, T.esta + .2, .1, 2);
  glowN.style.transform = `translate(${(gn.x - 750 + dx).toFixed(1)}px,${(gn.y - 750 + dy).toFixed(1)}px) scale(${(1 + .03 * Math.sin(t * 1.2)).toFixed(4)})`;
  glowN.style.opacity = clamp(gn.o * breath, 0, 1.3).toFixed(3);
  glowA.style.transform = `translate(${(ga.x - 750 + dx).toFixed(1)}px,${(ga.y - 750 + dy).toFixed(1)}px) scale(${(1 + .03 * Math.sin(t * 1.3) + fl * .2).toFixed(4)})`;
  glowA.style.opacity = clamp((ga.o + fl) * breath, 0, 1.4).toFixed(3);
  glowB.style.transform = `translate(${(gb.x - 750 + dx).toFixed(1)}px,${(gb.y - 750 + dy).toFixed(1)}px) scale(${(1 + .03 * Math.sin(t * 1.1 + 1)).toFixed(4)})`;
  glowB.style.opacity = clamp(gb.o * breath, 0, 1.3).toFixed(3);

  cabeceraChip(t); protagonistas(t); recuerdo(t); salto(t); rival(t); escenarios(t);

  for (const p of PULSES) {
    const k = (t - p.t0) / p.dur;
    if (k <= 0 || k >= 1) off(p.e);
    else put(p.e, { x: p.x, y: p.y, s: lerp(1, p.to, E.out3(k)), o: .8 * (1 - E.out2(k)) });
  }
}

  chip.pintar(t, { x: CX, y: y + (1 - P(t, t < 20 ? T.probando - .08 : T.no - .06, .4)) * 12, o });
}

/* --- Opus 5.5 y Astra --- */
function protagonistas(t) {
  const k = KF(t, OPK);
  const tiembla = t > T.salto + .2 && t < T.salto + .5 ? Math.sin(t * 95) * 3 * (1 - (t - T.salto - .2) / .3) : 0;
  const fin = flash(t, FIN + .9, .12, 1.6);
  card(cOpus, { ...k, x: k.x + tiembla }, KF(t, OPH).h + .5 * fin);
  rise(cOpus._fam, t, T.probando); slam(cOpus._nm, t, T.opus1 - .04, 1.3); slam(cOpus._ver, t, T.v55 - .04, 1.5);
  if (t > T.openai - .15) {
    card(cAstra, KF(t, ASK), KF(t, ASH).h + .5 * fin);
    rise(cAstra._fam, t, T.openai + .05); slam(cAstra._nm, t, T.astra - .04, 1.5);
  } else off(cAstra);
  if (t > T.enfrentarlo - .1) {
    const v = KF(t, VSK);
    put(vs, { ...v, s: v.s * (1 + .15 * bump(t, T.astra, .3) + .18 * bump(t, FIN + .9, .35)) });
    badgeState(vs, 1);
  } else off(vs);
  const flow = Math.max(0, t - 17) * 14;
  const enVs = t < T.en5 + .2;
  wVs.draw(0, P(t, T.enfrentarlo + .05, .45, E.io3), enVs ? .9 * (1 - P(t, T.en5 - .15, .3)) : 0, flow);
  wHead.draw(0, P(t, T.en5 + .45, .4, E.io3), .9, flow);
}

/* --- "me tengo que comer mis palabras": lo que decía antes, tachado y arrugado --- */
function recuerdo(t) {
  if (t < T.comer - .1 || t > T.esta + .4) { off(bocadillo); return; }
  const r = clamp((t - (T.comer - .05)) / .5);
  const cae = P(t, T.realidad + .5, .55, E.in3);                    // se arruga y cae
  put(bocadillo, {
    x: 1330 + (1 - E.out4(r)) * 60, y: 470 + cae * 110,
    s: lerp(.85, 1, E.back(r)) * (1 - .35 * cae), r: cae * 9,
    o: clamp(r * 2) * (1 - cae), b: cae * 6, g: .55,
  });
  // puntos suspensivos hasta que empieza la cita
  const cita0 = T.opus2 - .04, cita1 = T.tanto + .3;
  bDotsBox.style.opacity = (1 - P(t, cita0 - .1, .15)).toFixed(3);
  bDots.forEach((d, i) => { d.style.transform = `translateY(${(-6 * Math.max(0, Math.sin(t * 8 - i * .9))).toFixed(2)}px)`; });
  rise(bTag, t, T.videos - .04, .4, 10);
  const n = Math.floor(P(t, cita0, cita1 - cita0, E.lin) * CITA.length + (t >= cita0 ? 1 : 0));
  bQt.textContent = CITA.slice(0, Math.min(n, CITA.length));
  bStrike.style.transform = `scaleX(${P(t, T.realidad - .02, .38, E.io3).toFixed(4)})`;
}

/* --- "pega un salto importante" --- */
function salto(t) {
  if (t < T.pega - .1 || t > 15.9) { lineas.forEach(off); flechas.forEach(off); return; }
  const k = KF(t, OPK);
  const OFF = [-170, -85, 0, 85, 170], LARGO = [150, 230, 190, 250, 140];
  lineas.forEach((l, i) => {
    const e = P(t, T.salto - .1 + i * .03, .25, E.out3) * (1 - P(t, T.salto + .3 + i * .04, .55, E.in2));
    l.style.height = (LARGO[i] * e).toFixed(1) + 'px';
    put(l, { x: k.x + OFF[i] * k.s, y: k.y + 150 * k.s + 18, ay: 0, o: e * .9 });
  });
  flechas.forEach((f, i) => {
    const t0 = T.salto - .05 + i * .12, p = clamp((t - t0) / .9);
    put(f, { x: k.x + 340 * k.s, y: k.y + 90 - p * 170, o: Math.sin(Math.PI * p) * .9, s: .9 + .2 * p });
  });
}

/* --- el rival: hueco, corona "el mejor de OpenAI" --- */
function rival(t) {
  if (t < T.enfrentarlo || t > T.en5 + .8) { off(hueco); off(corona); return; }
  const hp = clamp((t - (T.enfrentarlo + .1)) / .45), hq = P(t, T.openai + .1, .3, E.in2);
  put(hueco, { x: VSP.xB, y: VSP.y, s: lerp(.92, 1, E.back(hp)), o: clamp(hp * 2) * (1 - hq) });
  huecoRect.style.strokeDashoffset = (-t * 22).toFixed(1);
  huecoLogo.style.opacity = (.22 + .12 * Math.sin(t * 4)).toFixed(3);
  const cp = clamp((t - (T.mejor - .05)) / .45), cq = P(t, T.en5 - .1, .35, E.in3);
  put(corona, { x: VSP.xB, y: VSP.y - 200 + (1 - E.out4(cp)) * 16, s: lerp(.8, 1, E.back(cp)), o: clamp(cp * 2) * (1 - cq) });
}

/* --- los 5 escenarios --- */
function escenarios(t) {
  const tituloO = t > T.cinco - .08 ? 1 : 0;
  lettersIn(title, t, titleT, .52);
  const cinco = title._ch[0], c5 = E.out4(clamp((t - (T.cinco - .04)) / .5));
  cinco.style.transform = `translateY(${((1 - c5) * .2).toFixed(3)}em) scale(${(lerp(1.6, 1, c5) * (1 + .08 * bump(t, FIN + .2, .5))).toFixed(4)})`;
  cinco.style.transformOrigin = '50% 80%';
  cinco.style.opacity = clamp((t - (T.cinco - .04)) / .16).toFixed(3);
  put(title, { x: CX, y: 402, o: tituloO });

  const next = k => (k < 4 ? ESC[k + 1].tIn : T.no);
  ESC.forEach((e, k) => {
    const x = XS[k], y = ROW.y, s = slots[k], c = cards[k];
    const sp = clamp((t - (T.completamente - .04 + k * .09)) / .45);
    put(s, { x, y, s: lerp(.9, 1, E.back(sp)), o: clamp(sp * 2) * (1 - P(t, e.tIn - .04, .18, E.lin)) });
    s._rect.style.strokeDashoffset = (-t * 18).toFixed(1);

    const r = clamp((t - (e.tIn - .04)) / .5);
    const on = P(t, e.tIn - .04, .3) * (1 - .72 * P(t, next(k) - .1, .5));
    const w = flash(t, WAVE(k), .1, 1.8), okf = flash(t, T.casos + .1 + k * .12, .08, 2.5);
    put(c, { x, y: y + (1 - E.out4(r)) * 28, s: lerp(.94, 1, E.out4(r)), o: clamp(r * 2.2), b: (1 - E.out4(r)) * 8 });
    c._hi.style.opacity = clamp(on + .75 * w + .5 * okf + .12 * P(t, WAVE(k) + .5, .6)).toFixed(3);
    const ip = clamp((t - (e.tIco - .06)) / .45);
    c._tile.style.transform = `scale(${(lerp(.55, 1, E.back(ip)) * (1 + .1 * bump(t, e.tIco + .3, .3))).toFixed(4)})`;
    drawStrokes(c._svg, P(t, e.tIco - .08, .7, E.io3), .08);
    slam(c._tt, t, e.tTit - .04, 1.3);
    c._tt.style.transformOrigin = '50% 75%';
    const dw = P(t, WAVE(k), .3);
    c._duel.style.opacity = (lerp(.45, 1, dw) * clamp((t - (e.tIn + .2)) / .4)).toFixed(3);
    c._pl.forEach(p => { p.style.filter = dw > .5 ? `drop-shadow(0 0 ${(8 * dw).toFixed(1)}px rgba(255,255,255,.35))` : 'none'; });
    // "casos de uso reales": marca verde de caso real
    const ok = clamp((t - (T.casos + .1 + k * .12)) / .4);
    c._ok.style.opacity = clamp(ok * 2.5).toFixed(3);
    c._ok.style.transform = `scale(${lerp(.3, 1, E.back(ok)).toFixed(4)})`;
  });
}

/* =====================================================================
   ARRANQUE: tamaño, fuentes, logos, ruido; luego layout() y render(0)
   ===================================================================== */
function makeNoise() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d'), d = x.createImageData(256, 256);
  let s = 1234567;
  const rnd = () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  for (let i = 0; i < d.data.length; i += 4) { const v = rnd() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  x.putImageData(d, 0, 0);
  $('noise').style.backgroundImage = `url(${c.toDataURL()})`;
}
async function cargarLogos() {
  let reg = {};
  try { const r = await fetch('assets/logos/logos.json', { cache: 'no-store' }); if (r.ok) reg = await r.json(); } catch (e) { /* sin logos */ }
  LOGOS = reg;
  for (const img of document.querySelectorAll('img[data-logo]')) {
    const k = img.dataset.logo, f = reg[k]?.file;
    img.src = 'assets/logos/' + (f ? f.split('/').pop() : `${k}.svg`);
  }
  await Promise.all([...document.images].map(i => i.decode().catch(() => console.error('logo sin cargar: ' + (i.dataset.logo || i.src)))));
}

STAGE.style.width = WORLD.style.width = CONFIG.ancho + 'px';
STAGE.style.height = WORLD.style.height = CONFIG.alto + 'px';
WORLD.style.transformOrigin = `${CX}px ${CY}px`;
$('wires').setAttribute('width', CONFIG.ancho); $('wires').setAttribute('height', CONFIG.alto);
$('wires').setAttribute('viewBox', `0 0 ${CONFIG.ancho} ${CONFIG.alto}`);

window.__CONFIG = CONFIG;
window.__ready = (async () => {
  const fonts = ['400 20px Outfit', '500 20px Outfit', '600 20px Outfit', '700 20px Outfit', '800 20px Outfit',
    '400 20px "JetBrains Mono"', '500 20px "JetBrains Mono"', '600 20px "JetBrains Mono"'];
  await Promise.all(fonts.map(f => document.fonts.load(f, 'Abc áéíóú ñ ½ $ ✓')));
  await document.fonts.ready;
  await cargarLogos();
  makeNoise();
  layout();
  render(Q.has('t') ? +Q.get('t') : 0);

})();
window.__render = t => render(t);

/* --- previsualización con audio: node server.mjs -> http://127.0.0.1:5178/ (espacio, flechas; ?t=12.5 salta) --- */
if (!RENDER) {
  // sin voz (proyecto creado con --dur) la previsualización corre con un reloj que imita al <audio>
  const reloj = () => { let base = 0, t0 = 0, on = false; return {
    get currentTime() { return on ? base + (performance.now() - t0) / 1000 : base; },
    set currentTime(v) { base = v; t0 = performance.now(); },
    play() { t0 = performance.now(); on = true; }, pause() { base = this.currentTime; on = false; },
    get ended() { return this.currentTime >= CONFIG.dur; } }; };
  const audio = CONFIG.audio ? $('audio') : reloj(), btn = $('play'), scrub = $('scrub'), lab = $('tlabel');
  if (CONFIG.audio) audio.src = CONFIG.audio;
  scrub.max = CONFIG.dur;
  let playing = false;
  const show = t => { render(t); scrub.value = t; lab.textContent = `${t.toFixed(2)} / ${CONFIG.dur.toFixed(2)} s`; };
  const fit = () => { const vp = $('viewport'); const s = Math.min(vp.clientWidth / CONFIG.ancho, vp.clientHeight / CONFIG.alto); STAGE.style.transform = `scale(${s})`; STAGE.style.margin = `${(CONFIG.alto * s - CONFIG.alto) / 2}px ${(CONFIG.ancho * s - CONFIG.ancho) / 2}px`; };
  window.addEventListener('resize', fit); fit();
  const loop = () => { if (!playing) return; show(Math.min(audio.currentTime, CONFIG.dur)); if (audio.ended) { playing = false; btn.textContent = '▶'; } else requestAnimationFrame(loop); };
  const toggle = () => {
    if (playing) { audio.pause(); playing = false; btn.textContent = '▶'; return; }
    if (audio.currentTime >= CONFIG.dur - .05) audio.currentTime = 0;
    audio.play(); playing = true; btn.textContent = '❚❚'; loop();
  };
  btn.onclick = toggle;
  scrub.oninput = () => { audio.currentTime = +scrub.value; show(+scrub.value); };
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { const d = (e.shiftKey ? .1 : 1) * (e.code === 'ArrowRight' ? 1 : -1); audio.currentTime = clamp(audio.currentTime + d, 0, CONFIG.dur); show(audio.currentTime); }
  });
  window.__ready.then(() => { if (Q.has('t')) audio.currentTime = +Q.get('t'); show(Q.has('t') ? +Q.get('t') : 0); });
}
