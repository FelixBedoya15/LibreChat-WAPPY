/* Paleta: base oscura del canal + un color por bando (Claude = coral de marca, OpenAI = azul frío) */
:root{
  --bg:#0a0c10; --text:#eef1f7; --text2:#d5dae4; --muted:#98a1b3; --label:#8d97ab;
  --claude:#D97757; --claude2:#EE9A7A; --claude3:#F4B79E;
  --oai:#7C9CFF; --oai2:#A5BAFF; --oai3:#C8D5FF;

  --card-b:#252932; --chip-bg:#12151c; --chip-b:#2a2f3a;

  --sans:'Outfit',system-ui,sans-serif;

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050608;overflow:hidden}
#viewport{position:absolute;left:0;right:0;top:0;bottom:56px;display:flex;align-items:center;justify-content:center}
body.render #viewport{bottom:0;align-items:flex-start;justify-content:flex-start}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg);font-family:var(--sans);color:var(--text);flex:none}

/* fondo */
#grid{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(160,176,214,.15) 1.3px,transparent 1.9px);background-size:36px 36px;
  -webkit-mask-image:radial-gradient(ellipse 72% 72% at 50% 48%,#000 30%,transparent 100%);mask-image:radial-gradient(ellipse 72% 72% at 50% 48%,#000 30%,transparent 100%)}
.glow{position:absolute;left:0;top:0;width:1500px;height:1500px;border-radius:50%}
#glowN{background:radial-gradient(closest-side,rgba(78,108,220,.17),rgba(78,108,220,.05) 55%,transparent 100%)}
#glowW{background:radial-gradient(closest-side,rgba(217,119,87,.22),rgba(217,119,87,.065) 52%,transparent 100%)}
#glowC{background:radial-gradient(closest-side,rgba(104,136,255,.22),rgba(104,136,255,.065) 52%,transparent 100%)}
#vignette{position:absolute;inset:0;background:radial-gradient(ellipse 85% 82% at 50% 50%,transparent 58%,rgba(0,0,0,.5) 100%);pointer-events:none}
#noise{position:absolute;inset:0;opacity:.04;pointer-events:none}
#world{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:960px 540px}
#wires{position:absolute;left:0;top:0;z-index:2;overflow:visible}

.L{position:absolute;left:0;top:0;visibility:hidden}
.z1{z-index:1}.z2{z-index:2}.z3{z-index:3}.z4{z-index:4}.z5{z-index:5}.z6{z-index:6}.z7{z-index:7}.z8{z-index:8}

/* título */
.eyebrow{font-family:var(--mono);font-size:24px;font-weight:500;letter-spacing:.22em;color:var(--label);white-space:nowrap}
.title{font-weight:800;font-size:106px;letter-spacing:-.03em;line-height:1.08;white-space:nowrap;color:var(--text)}
.title .ch{display:inline-block}
.title .ch.grad{color:transparent;-webkit-background-clip:text;background-clip:text;background-image:linear-gradient(90deg,#E8906F 0%,#F1B19A 38%,#B4C6FF 62%,#86A3FF 100%)}
.uline{width:150px;height:7px;border-radius:4px;background:linear-gradient(90deg,var(--claude),var(--oai))}
.caret-i{display:inline-block;width:.55em;height:1em;margin-left:3px;vertical-align:-4px;background:#aab6d3;opacity:.85}

/* chip de cabecera */
.chip{display:flex;align-items:center;gap:16px;height:72px;padding:0 32px 0 26px;border-radius:999px;background:var(--chip-bg);border:1.5px solid var(--chip-b);
  font-family:var(--mono);font-size:30px;font-weight:500;color:#dfe4ee;white-space:nowrap;box-shadow:0 20px 50px -24px rgba(0,0,0,.8)}
.chip .ic{width:32px;height:32px;color:#b7c1da;display:flex;flex:none}
.chip .tx{position:relative;display:flex;align-items:center}
.chip .strike{position:absolute;left:-6px;right:-6px;top:50%;height:3px;margin-top:-1px;border-radius:2px;background:#ec8a70;transform-origin:0 50%;transform:scaleX(0);box-shadow:0 0 10px rgba(236,138,112,.6)}

/* tarjetas de modelo */
.mcard{width:500px;height:300px;border-radius:30px;background:linear-gradient(180deg,#15171e,#0d0f14);border:1.5px solid var(--card-b);box-shadow:0 44px 90px -40px rgba(0,0,0,.9)}

.mcard.oai{--c:#7C9CFF;--rgb:124,156,255;--c2:#A5BAFF;--c3:#C8D5FF}
.mcard .hi{position:absolute;inset:-1.5px;border-radius:30px;border:1.5px solid rgba(var(--rgb),.85);
  background:linear-gradient(160deg,rgba(var(--rgb),.17),rgba(var(--rgb),.035) 62%);
  box-shadow:0 0 0 1px rgba(var(--rgb),.22),0 36px 100px -30px rgba(var(--rgb),.7);opacity:0}
.mcard .ltile{position:absolute;left:36px;top:36px;width:88px;height:88px;border-radius:24px;background:#0b0c10;border:1.5px solid rgba(var(--rgb),.5);

.mcard .co{position:absolute;right:38px;top:66px;font-family:var(--mono);font-size:19px;font-weight:500;letter-spacing:.16em;color:var(--c3)}
.mcard .fam{position:absolute;left:38px;top:150px;font-size:34px;font-weight:500;color:#9aa3b5;white-space:nowrap}
.mcard .name{position:absolute;left:35px;top:190px;font-size:84px;font-weight:800;letter-spacing:-.03em;line-height:1;color:#f3f5fa;white-space:nowrap;display:flex}
.mcard .name span{display:inline-block}
.mcard .ver{color:var(--c2);margin-left:.2em}

/* tarjeta misteriosa */
.qcard{width:500px;height:300px}
.qcard svg{position:absolute;left:0;top:0;overflow:visible}
.qcard .q{position:absolute;left:0;right:0;top:40px;text-align:center;font-size:190px;font-weight:800;line-height:1;color:#566179}

/* insignias VS / = */

.bar.oai{background:linear-gradient(180deg,#93ADFF,#4866D6);box-shadow:0 30px 80px -30px rgba(124,156,255,.8)}
.bar .price{position:absolute;left:0;right:0;top:24px;text-align:center;font-weight:800;font-size:52px;color:#fff;letter-spacing:-.01em;white-space:nowrap}
.bar .pcap{position:absolute;left:0;right:0;top:88px;text-align:center;font-family:var(--mono);font-size:19px;color:rgba(255,255,255,.85);letter-spacing:.06em;white-space:nowrap}
.bar .mark{position:absolute;left:0;right:0;bottom:235px;border-top:2.5px dashed rgba(255,255,255,.8);opacity:0}
.bar .shine{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0) 60%);opacity:0}
.baseline{width:1080px;height:2px;border-radius:1px;background:#2f3544}
.halfchip{height:62px;padding:0 28px 0 24px;border-radius:999px;background:#0d0f14;border:1.5px solid #5a6276;display:flex;align-items:center;gap:12px;
  font-family:var(--mono);font-size:29px;font-weight:500;color:#eef1f7;white-space:nowrap;box-shadow:0 14px 34px -14px rgba(0,0,0,.9)}
.halfchip b{font-family:var(--sans);font-weight:800;font-size:40px;color:var(--claude2)}

/* controles de previsualización */
#controls{position:fixed;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 18px;background:#0a0c10;border-top:1px solid #1e2129;
  font-family:var(--mono);color:var(--muted);font-size:13px}
#controls button{width:38px;height:34px;border-radius:8px;border:1px solid #2b303d;background:#141a2c;color:#cfdbff;font-size:15px;cursor:pointer}
#controls input{flex:1;accent-color:#7C9CFF}
#controls .t{min-width:110px;text-align:right}
body.render #controls{display:none}
</style>

<script>

/* =====================================================================

const Q = new URLSearchParams(location.search);
const RENDER = Q.has('render');

const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;

/* respuesta de un muelle amortiguado a un escalón (0 -> 1) y a un golpe (0 -> ±1 -> 0) */
function step(tau, w = 9, z = .35) {
  if (tau <= 0) return 0;
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * tau) * (Math.cos(wd * tau) + (z * w / wd) * Math.sin(wd * tau));

function impulse(tau, w = 10, z = .3) {
  if (tau <= 0) return 0;
  const wd = w * Math.sqrt(1 - z * z);
  return Math.exp(-z * w * tau) * Math.sin(wd * tau);

/* fotogramas clave: [[t, {props}, ease], ...]; norm() rellena lo que falte con el anterior */
function norm(keys) {
  let prev = {};
  return keys.map(([t, v, e]) => { const full = { ...prev, ...v }; prev = full; return e ? [t, full, e] : [t, full]; });
}
function KF(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {

      for (const k in v1) o[k] = lerp(v0[k] ?? v1[k], v1[k], p);
      return o;
    }
  }
  return keys[keys.length - 1][1];
}
const mix = (a, b, p) => `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], p))).join(',')})`;

const $ = id => document.getElementById(id);
const STAGE = $('stage'), WORLD = $('world'), WIRES = $('wiresG');

  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  (parent || WORLD).appendChild(e);

function put(e, o) {
  const op = o.o ?? 1;
  if (!(op > 0.002)) { if (e._v !== 0) { e.style.visibility = 'hidden'; e.style.opacity = 0; e._v = 0; } return; }
  if (e._v !== 1) { e.style.visibility = 'visible'; e._v = 1; }

  if (o.ry) tr += ` perspective(1600px) rotateY(${o.ry.toFixed(3)}deg)`;
  if (o.r) tr += ` rotate(${o.r.toFixed(3)}deg)`;
  const s = o.s ?? 1, sx = (o.sx ?? 1) * s, sy = (o.sy ?? 1) * s;
  if (sx !== 1 || sy !== 1) tr += ` scale(${sx.toFixed(4)},${sy.toFixed(4)})`;
  e.style.transform = tr;
  e.style.transformOrigin = `${ax}% ${ay}%`;
  e.style.opacity = op.toFixed(4);
  const f = [], b = o.b ?? 0, g = o.g ?? 0, br = o.br ?? 1;
  if (b > 0.05) f.push(`blur(${b.toFixed(2)}px)`);
  if (g > 0.005) f.push(`grayscale(${g.toFixed(3)})`);
  if (Math.abs(br - 1) > 0.005) f.push(`brightness(${br.toFixed(3)})`);
  e.style.filter = f.length ? f.join(' ') : 'none';
}

/* ---------- conectores discontinuos ---------- */
class Wire {
  constructor(pts, o = {}) {
    this.el = document.createElementNS(SVGNS, 'path');
    this.el.setAttribute('fill', 'none');
    this.el.setAttribute('stroke', o.color || '#4a5266');
    this.el.setAttribute('stroke-width', o.width || 2);
    this.el.setAttribute('stroke-linecap', 'round');
    if (o.dash !== null) this.el.setAttribute('stroke-dasharray', o.dash || '7 9');
    WIRES.appendChild(this.el);
    this.set(pts);
  }
  set(pts) {
    this.pts = pts; this.seg = []; this.L = 0;
    for (let i = 1; i < pts.length; i++) {
      const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
      this.seg.push(l); this.L += l;
    }
  }
  sub(a, b) {
    const A0 = a * this.L, B0 = b * this.L, out = [];
    let acc = 0;
    for (let i = 0; i < this.seg.length; i++) {
      const s0 = acc, s1 = acc + this.seg[i]; acc = s1;
      if (s1 < A0 || s0 > B0 || !this.seg[i]) continue;
      const p0 = clamp((A0 - s0) / this.seg[i]), p1 = clamp((B0 - s0) / this.seg[i]);
      const a0 = this.pts[i], b0 = this.pts[i + 1];
      if (!out.length) out.push(`M${lerp(a0[0], b0[0], p0).toFixed(2)} ${lerp(a0[1], b0[1], p0).toFixed(2)}`);
      out.push(`L${lerp(a0[0], b0[0], p1).toFixed(2)} ${lerp(a0[1], b0[1], p1).toFixed(2)}`);
    }
    return out.join('');
  }
  /* dibuja el tramo [a,b] (fracciones). flow = desplazamiento de las rayas en px */
  draw(a, b, op = 1, flow = 0) {
    if (b - a <= 0.0005 || op <= 0.002) { this.el.style.opacity = 0; this.el.setAttribute('d', ''); return; }
    this.el.setAttribute('d', this.sub(a, b));
    this.el.style.opacity = op.toFixed(3);
    this.el.style.strokeDashoffset = (a * this.L - flow).toFixed(2);
  }
}

function layout() {

  const g = title._ch.filter(c => c.classList.contains('grad'));

  const ring = (t0, keys, rgb, to = 1.16, dur = .8) => { const k = KF(t0, keys); pulse(t0, dur, k.x, k.y, 500 * k.s, 300 * k.s, 30 * k.s, rgb, to); };
  ring(C.humillar, OPK, RGB_C, 1.14);
  ring(C.opus2 - .02, OPK, RGB_C);

  ring(C.bestia - .04, OPK, RGB_C, 1.3, .9);
  ring(C.bestia + .1, OPK, RGB_C, 1.2, .8);

function render(t) {
  // cámara y fondo
  const cam = KF(t, CAMK), dx = -(cam.x - 960) * cam.s, dy = -(cam.y - 540) * cam.s;
  WORLD.style.transform = `translate(${dx.toFixed(2)}px,${dy.toFixed(2)}px) scale(${cam.s.toFixed(5)})`;
  grid.style.opacity = P(t, 0, .5, E.out2).toFixed(3);
  grid.style.backgroundPosition = `${(dx * .3 - t * 4).toFixed(2)}px ${(dy * .3 - t * 2).toFixed(2)}px`;
  const breath = .9 + .1 * Math.sin(t * 1.7);
  const nO = P(t, 0, 1.2, E.out2) * lerp(1, .35, P(t, 2.7, 1.2)) * lerp(1, 1.6, P(t, 35.0, .8)) * breath;
  glowN.style.transform = `translate(${(960 - 750 + dx * .6).toFixed(1)}px,${(470 - 750 + dy * .6).toFixed(1)}px)`;
  glowN.style.opacity = clamp(nO * .9).toFixed(3);
  const gw = KF(t, GWK), gc = KF(t, GCK);
  const bestiaFlare = .6 * flash(t, C.bestia - .02, .1, 2.4);
  glowW.style.transform = `translate(${(gw.x - 750 + dx).toFixed(1)}px,${(gw.y - 750 + dy).toFixed(1)}px) scale(${(1 + .03 * Math.sin(t * 1.3) + bestiaFlare * .25).toFixed(4)})`;
  glowW.style.opacity = clamp((gw.o + bestiaFlare) * breath, 0, 1.3).toFixed(3);
  glowC.style.transform = `translate(${(gc.x - 750 + dx).toFixed(1)}px,${(gc.y - 750 + dy).toFixed(1)}px) scale(${(1 + .03 * Math.sin(t * 1.1 + 1)).toFixed(4)})`;
  glowC.style.opacity = clamp(gc.o * breath, 0, 1.3).toFixed(3);

  scene1(t); balanza(t); chip(t); cards(t); ladder(t); cost(t);

  for (const p of PULSES) {
    const k = (t - p.t0) / p.dur;
    if (k <= 0 || k >= 1) off(p.e);
    else put(p.e, { x: p.x, y: p.y, s: lerp(1, p.to, E.out3(k)), o: .8 * (1 - E.out2(k)) });
  }
}

/* --- ESCENA 1: "Lo primero, las reglas de la comparación" --- */
function scene1(t) {
  if (t > 3.3) { [eyebrow, title, uline].forEach(off); return; }
  const q = P(t, 2.62, .36, E.in3);                        // salida
  const n = Math.floor(P(t, C.lo - .02, .42, E.lin) * 10);

  put(eyebrow, { x: 960, y: 452 - q * 16, o: (t > C.lo - .04 ? 1 : 0) * (1 - q), b: q * 4 });

  title._ch.forEach((c, i) => {
    const t0 = letterT[i]; if (t0 == null) return;

}

/* --- BALANZA (escenas 1 a 4) --- */
function beamAngle(t) {
  let a = 0;
  a += -8 * step(t - 4.86, 9, .42);          // cae la ficha de Claude: se inclina
  a += 8 * step(t - 6.82, 9, .42);           // cae la de OpenAI: equilibrio ("la comparación justa")
  a += -17 * step(t - (C.humillar - .04), 9, .34);   // "humillar"
  a += -4 * step(t - C.color, 10, .45);      // "no hay color"
  a += -6 * step(t - 13.98, 9, .38);         // Sol se va: plato vacío
  a += 27 * step(t - 21.99, 7.5, .38);       // llega Astra: vuelve el equilibrio
  a += Math.sin(t * 1.9) * .5;               // respiración
  return a;
}
function balanza(t) {
  if (t > 23.4) { off(scaleEl); return; }
  // posición: pequeña sobre el título -> centro de la comparación -> se va
  const mv = P(t, 2.66, .78, E.io4);
  const out = P(t, C.recordemos, .42, E.in3);
  const x = 960, y = lerp(272, PIV[1], mv) - out * 20;
  const s = lerp(.62, 1, mv) * (1 - .25 * out);
  const tx = 220, ty = 90;   // pivote dentro del elemento (px)
  put(scaleEl, { x, y, s, ax: tx / 440 * 100, ay: ty / 360 * 100, o: P(t, .4, .3, E.lin) * (1 - out), b: out * 5 });

  // dibujado de los trazos (escena 1)
  const dp = P(t, .46, 1.1, E.io3);
  SC.strokes.forEach((p, i) => {
    const q = clamp((dp - i * .045) / (1 - 7 * .045));
    p.style.strokeDasharray = q >= 1 ? 'none' : '1 2';
    p.style.strokeDashoffset = (1 - q).toFixed(4);
    p.style.opacity = q > .002 ? 1 : 0;
  });
  const pv = clamp((t - 1.0) / .4);
  SC.pivot.setAttribute('transform', `scale(${lerp(0, 1, E.back(pv)).toFixed(3)})`);

  // placa "VS"
  const pl = clamp((t - (C.frente1 - .08)) / .45);
  const plb = 1 + .12 * bump(t, C.frente2 - .04, .32);
  SC.plate.setAttribute('transform', `translate(0 225) scale(${(lerp(.5, 1, E.back(pl)) * plb).toFixed(4)}) translate(0 -225)`);
  SC.plate.style.opacity = clamp(pl * 2.5).toFixed(3);

  // brazo y platos (cuelgan siempre verticales, con un pequeño balanceo por la velocidad)
  const a = beamAngle(t), rad = a * Math.PI / 180;
  const w = (beamAngle(t + .012) - beamAngle(t - .012)) / .024;
  const swing = clamp(-w * .05, -9, 9);
  SC.beam.setAttribute('transform', `rotate(${a.toFixed(3)})`);
  const hx = 140 * Math.cos(rad), hy = 140 * Math.sin(rad);
  SC.panL.setAttribute('transform', `translate(${(-hx).toFixed(2)} ${(-hy).toFixed(2)}) rotate(${swing.toFixed(2)})`);
  SC.panR.setAttribute('transform', `translate(${hx.toFixed(2)} ${hy.toFixed(2)}) rotate(${swing.toFixed(2)})`);

  // color de los platos: Claude coral / OpenAI azul (el de OpenAI "pierde el color")
  const grey = [128, 134, 148];
  const lostR = P(t, C.color - .04, .4, E.io3) * (1 - P(t, 21.8, .3));
  const colL = 'rgb(217,119,87)', colR = mix([124, 156, 255], grey, lostR);
  SC.bowlL.setAttribute('stroke', colL); SC.bowlL.setAttribute('fill', 'rgba(217,119,87,.16)');
  SC.bowlR.setAttribute('stroke', colR); SC.bowlR.setAttribute('fill', lostR > .5 ? 'rgba(128,134,148,.1)' : 'rgba(124,156,255,.16)');
  const fillP = P(t, 1.2, .5);
  SC.bowlL.style.fillOpacity = SC.bowlR.style.fillOpacity = fillP.toFixed(3);

  // fichas con el logo sobre cada plato
  const tokL = clamp((t - 4.66) / .2);
  const dropL = (1 - E.in2(tokL)) * -70;
  SC.tokL.setAttribute('transform', `translate(0 ${dropL.toFixed(2)})`);
  SC.tokL.style.opacity = clamp(tokL * 3).toFixed(3);
  SC.tokcL.setAttribute('stroke', colL);
  // derecha: Sol (6.62 -> se va en 13.8) y luego Astra (cae en 21.99)
  let tr = 0, to = 0;
  if (t < 13.8) { const k = clamp((t - 6.62) / .2); tr = (1 - E.in2(k)) * -70; to = clamp(k * 3); }
  else if (t < 21.7) { const k = P(t, 13.8, .3, E.in2); tr = -k * 60; to = 1 - k; }
  else { const k = clamp((t - 21.79) / .2); tr = (1 - E.in2(k)) * -80; to = clamp(k * 3); }
  SC.tokR.setAttribute('transform', `translate(0 ${tr.toFixed(2)})`);
  SC.tokR.style.opacity = to.toFixed(3);
  SC.tokcR.setAttribute('stroke', colR);
  SC.toklR.setAttribute('fill', mix([255, 255, 255], [150, 156, 168], lostR));
}

/* --- CHIP DE CABECERA: se escribe al ritmo de la voz --- */
const CHIP = [
  { t0: 2.98, icon: 'scale', segs: [[C.la2, 3.56, 'la comparación'], [C.justa - .02, 3.92, ' justa']], strike: C.porLoQue - .02, del: [14.54, 14.84] },
  { t0: 14.84, icon: 'sparkles', segs: [[C.algo, 16.25, 'algo aún más interesante']], del: [16.86, 17.08] },
  { t0: 17.08, icon: 'flask', segs: [[C.las2, 17.56, 'las pruebas']] },
  { t0: 35.66, icon: 'coins', segs: [[C.factor - .02, 36.55, 'coste por millón de tokens']] },
];
function typed(segs, t) {
  let s = '', typing = false;
  for (const [a, b, txt] of segs) {
    const n = Math.floor(clamp((t - a) / (b - a)) * txt.length + (t >= a ? 1 : 0));
    s += txt.slice(0, Math.min(n, txt.length));
    if (t >= a && t < b) typing = true;
  }
  return { s, typing };
}
function chip(t) {
  const inO = P(t, 2.98, .3) * (1 - P(t, C.recordemos, .3, E.in3)) + P(t, 35.66, .3);
  if (inO <= .002) { off(hchip); return; }
  let ph = CHIP[0];
  for (const c of CHIP) if (t >= c.t0) ph = c;
  if (hchip._ph !== ph) { hIc.innerHTML = icon(ph.icon, 32, 2); hchip._ph = ph; }
  let { s, typing } = typed(ph.segs, t);
  if (ph.del && t > ph.del[0]) s = s.slice(0, Math.floor(s.length * (1 - P(t, ph.del[0], ph.del[1] - ph.del[0], E.lin))));
  hTx.textContent = s;
  const last = ph.segs[ph.segs.length - 1][1];
  hCaret.style.display = (typing || (t > ph.t0 && t < last + .7) || (ph.del && t > ph.del[0])) ? 'inline-block' : 'none';
  hCaret.style.opacity = typing ? 1 : blink(t, 2.4);
  hStrike.style.transform = `scaleX(${(ph.strike ? P(t, ph.strike, .36, E.io3) * (1 - P(t, ph.del[0] - .1, .1, E.lin)) : 0).toFixed(4)})`;
  hIc.style.opacity = P(t, ph.t0, .25).toFixed(3);
  const y = t < 30 ? 218 : 146;
  put(hchip, { x: 960, y: y + (1 - P(t, t < 30 ? 2.98 : 35.66, .4, E.out3)) * 12, o: inO });
}

/* --- TARJETAS DE MODELO --- */
function card(e, k, h) {
  put(e, k);
  e._hi.style.opacity = clamp(h).toFixed(3);
}
function cards(t) {
  // Claude Opus 5.5
  const op = KF(t, OPK), oh = KF(t, OPH).h;
  const beast = .075 * bump(t, C.bestia - .02, .34);
  card(cOpus, { ...op, s: op.s * (1 + beast), x: op.x + (t > C.bestia && t < C.bestia + .3 ? Math.sin(t * 90) * 2.5 * (1 - (t - C.bestia) / .3) : 0) }, oh);
  rise(cOpus._fam, t, C.opus1 - .02); slam(cOpus._nm, t, C.opus1 - .02, 1.25); slam(cOpus._ver, t, C.v55a - .02, 1.5);
  // destellos del número de versión cuando la voz lo repite
  const vf = Math.max(flash(t, C.v55b, .06, 3), flash(t, C.v55c, .06, 3));
  cOpus._ver.style.textShadow = vf > .01 ? `0 0 ${(22 * vf).toFixed(1)}px rgba(238,154,122,${(.9 * vf).toFixed(3)})` : 'none';

  // GPT-6 Sol
  if (t < 33.2) {
    const so = KF(t, SOK);
    card(cSol, so, KF(t, SOH).h * (t < 20 ? 1 : 0));
    rise(cSol._fam, t, C.gpt1 - .02); slam(cSol._nm, t, C.sol - .03, 1.35);
  } else off(cSol);

  // tarjeta "?"
  if (t > 14.7 && t < 21.4) {
    const q = KF(t, QK);
    put(cQ, q);
    qRect.style.strokeDashoffset = (-t * 22).toFixed(1);
    const glowQ = .5 + .5 * Math.sin(t * 5.2);
    qMark.style.color = mix([86, 97, 121], [150, 162, 190], P(t, C.aun, .6) * glowQ);
    qMark.style.transform = `scale(${(1 + .05 * P(t, C.aun, .5) * Math.sin(t * 5.2)).toFixed(4)})`;
  } else off(cQ);

  // GPT-6 Astra
  if (t > 21.2) {
    const a = KF(t, AK);
    card(cAstra, a, KF(t, AH).h);
    rise(cAstra._fam, t, 21.3, .3, 10); slam(cAstra._nm, t, C.astra1 - .04, 1.5);
  } else off(cAstra);

  // Claude Fable 5.1
  if (t > 28.1 && t < 32.9) {
    card(cFable, KF(t, FK), KF(t, FH).h);
    rise(cFable._fam, t, C.fable - .02); slam(cFable._nm, t, C.fable - .02, 1.3); slam(cFable._ver, t, C.v51 - .02, 1.5);
  } else off(cFable);
}

/* --- ESCALERA DE GAMAS (escenas 5-6) --- */
function ladder(t) {
  if (t < 24.9 || t > 35.8) {
    [bandTop, bandMid, lblTop, lblMid, hdrA, hdrO, bMid].forEach(off); wTop.draw(0, 0, 0); wMid.draw(0, 0, 0);
  }
  if (t <= 27.4) off(bTop);
  const X = P(t, C.ademas, .38, E.in3);                  // salida hacia el coste
  if (t >= 24.9 && t <= 35.8) {
    // franjas de gama
    const b1 = clamp((t - (C.tope - .06)) / .5);
    const gold = flash(t, C.comparativa, .1, 1.6);
    put(bandTop, { x: BX, y: LAD.y1, sx: lerp(.94, 1, E.out4(b1)), o: E.out3(b1) * (1 - X) });
    bandTop.style.boxShadow = gold > .01 ? `0 0 0 1px rgba(233,196,106,${(.5 * gold).toFixed(3)}),0 0 60px -10px rgba(233,196,106,${(.5 * gold).toFixed(3)})` : 'none';
    const b2 = clamp((t - (C.modelos + .06)) / .5), b2o = 1 - P(t, 32.6, .4, E.in3);
    put(bandMid, { x: BX, y: LAD.y2, sx: lerp(.94, 1, E.out4(b2)), o: E.out3(b2) * b2o * (1 - X) * lerp(1, .6, P(t, C.pero2, .3)) });
    const l1 = P(t, C.tope, .42, E.out4), l2 = P(t, C.modelos + .12, .42, E.out4);
    put(lblTop, { x: 556 - (1 - l1) * 16, y: LAD.y1, ax: 100, o: l1 * (1 - X) });
    put(lblMid, { x: 556 - (1 - l2) * 16, y: LAD.y2, ax: 100, o: l2 * b2o * (1 - X) * lerp(1, .6, P(t, C.pero2, .3)) });
    // cabeceras de columna
    const hO = P(t, C.modelos - .04, .45, E.out4), hA = P(t, C.fable - .04, .45, E.out4);
    put(hdrO, { x: LAD.xR, y: 236 + (1 - hO) * 14, s: 1 + .06 * bump(t, C.openai2, .35), o: hO * (1 - X) });
    put(hdrA, { x: LAD.xL, y: 236 + (1 - hA) * 14, o: hA * (1 - X) });
    // conectores "=" (misma gama)
    const flow = Math.max(0, t - 27) * 14;
    wTop.draw(0, P(t, C.equivalente - .02, .42, E.io3), lerp(1, .45, P(t, C.pero2, .3)) * (1 - X), flow);
    const m1 = P(t, 28.86, .4, E.io3), m1o = P(t, 32.3, .3, E.in3);
    wMid.draw(0, m1 * (1 - m1o), .6 * (1 - X), flow);
    const bm = clamp((t - 29.0) / .35);
    put(bMid, { x: BX, y: LAD.y2, s: lerp(.4, 1, E.back(bm)) * (1 - .4 * m1o), o: clamp(bm * 2) * .8 * (1 - m1o) });
    bMid._eq.style.opacity = 1; bMid._vs.style.opacity = 0;
  }
  // insignia de la fila de arriba (sigue viva en la escena de coste)
  if (t > 27.4) {
    const k = KF(t, BTK), vsP = P(t, C.comparativa - .08, .3, E.io3);
    const pop = 1 + .22 * bump(t, C.comparativa - .08, .36);
    put(bTop, { ...k, s: k.s * pop });
    bTop._eq.style.opacity = (1 - vsP).toFixed(3);
    bTop._eq.style.transform = `rotate(${(vsP * 90).toFixed(1)}deg) scale(${(1 - .5 * vsP).toFixed(3)})`;
    bTop._vs.style.opacity = vsP.toFixed(3);
    bTop._vs.style.transform = `scale(${lerp(.4, 1, E.back(vsP)).toFixed(3)})`;
    bTop.style.borderColor = vsP > .5 ? mix([52, 58, 71], [233, 196, 106], clamp(flash(t, C.comparativa, .1, 1.2) * .9)) : '#343a47';
  }
}

/* --- COSTE (escena 7) --- */
function cost(t) {
  if (t < 35.3) { [...tracks, barO, barA, baseline, halfChip].forEach(off); wHalf.draw(0, 0, 0); wVs.draw(0, 0, 0); return; }
  const base = COST.base, H = COST.hMax;
  const bl = P(t, 35.9, .55, E.io3);
  put(baseline, { x: 960, y: base + 1, sx: Math.max(.001, bl), o: bl > 0 ? 1 : 0 });
  tracks.forEach((e, i) => {
    const p = P(t, 36.0 + i * .08, .45);
    put(e, { x: i ? COST.xR : COST.xL, y: base, ay: 100, o: p * .9, sy: lerp(.96, 1, p) });
  });
  wVs.draw(0, P(t, 35.62, .4, E.io3), .9, Math.max(0, t - 35.6) * 14);

  // barras: Astra primero (referencia), luego Opus al decir "coste"
  const grow = (e, x, frac, t0, dur, vals) => {
    const p = P(t, t0, dur, E.out3);
    const h = Math.max(1, H * frac * p);
    e.style.height = h.toFixed(1) + 'px';
    put(e, { x, y: base, ay: 100, o: p > 0 ? 1 : 0 });
    if (!e._price.textContent) e._price.textContent = `$${vals[0]} / $${vals[1]}`;   // tarifa real, sin cifras intermedias
    const tp = clamp((h - 120) / 50);
    e._price.style.opacity = tp.toFixed(3); e._price.style.transform = `translateY(${((1 - tp) * 10).toFixed(2)}px)`;
    e._cap.style.opacity = clamp((h - 150) / 30).toFixed(3);
  };
  grow(barA, COST.xR, 1, C.tener - .02, .95, PRICE.astra);
  grow(barO, COST.xL, PRICE.opus[1] / PRICE.astra[1], C.tiene - .02, .8, PRICE.opus);
  barA._shine.style.opacity = (.55 * flash(t, C.astra3 - .02, .08, 3)).toFixed(3);
  barO._shine.style.opacity = (.5 * flash(t, C.mitad + .1, .08, 3)).toFixed(3);

  // línea de "la mitad" (del coste de Astra)
  wHalf.draw(0, P(t, C.mitad - .06, .5, E.io3), .75, Math.max(0, t - C.mitad) * 12);
  barA._mark.style.opacity = P(t, C.mitad + .12, .3).toFixed(3);   // la mitad marcada también sobre la barra de Astra
  const hc = clamp((t - (C.mitad - .02)) / .42);
  put(halfChip, { x: 960, y: base - H / 2, s: lerp(.6, 1, E.back(hc)) * (1 + .06 * bump(t, C.astra3, .3)), o: clamp(hc * 2.2) });
}

/* =====================================================================
   ARRANQUE: fuentes, imágenes, ruido, controles
   ===================================================================== */
function makeNoise() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d'), d = x.createImageData(256, 256);
  let s = 1234567;
  const rnd = () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  for (let i = 0; i < d.data.length; i += 4) { const v = rnd() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  x.putImageData(d, 0, 0);
  $('noise').style.backgroundImage = `url(${c.toDataURL()})`;
}

window.__ready = (async () => {
  const fonts = ['400 20px Outfit', '500 20px Outfit', '600 20px Outfit', '700 20px Outfit', '800 20px Outfit',
    '400 20px "JetBrains Mono"', '500 20px "JetBrains Mono"', '600 20px "JetBrains Mono"'];
  await Promise.all(fonts.map(f => document.fonts.load(f, 'Opus Astra comparación áéíóú ½$')));
  await document.fonts.ready;
  makeNoise();
  layout();
  render(Q.has('t') ? +Q.get('t') : 0);
  return true;
})();
window.__render = t => render(t);

/* --- previsualización con audio --- */
if (!RENDER) {
  const audio = $('audio'), btn = $('play'), scrub = $('scrub'), lab = $('tlabel');
  let playing = false;
  const show = t => { render(t); scrub.value = t; lab.textContent = `${t.toFixed(2)} / ${DUR.toFixed(2)} s`; };
  const fit = () => { const vp = $('viewport'); const s = Math.min(vp.clientWidth / 1920, vp.clientHeight / 1080); STAGE.style.transform = `scale(${s})`; STAGE.style.margin = `${(1080 * s - 1080) / 2}px ${(1920 * s - 1920) / 2}px`; };
  window.addEventListener('resize', fit); fit();
  const loop = () => { if (!playing) return; show(Math.min(audio.currentTime, DUR)); if (audio.ended) { playing = false; btn.textContent = '▶'; } else requestAnimationFrame(loop); };
  const toggle = () => {
    if (playing) { audio.pause(); playing = false; btn.textContent = '▶'; return; }
    if (audio.currentTime >= DUR - .05) audio.currentTime = 0;
    audio.play(); playing = true; btn.textContent = '❚❚'; loop();
  };
  btn.onclick = toggle;
  scrub.oninput = () => { audio.currentTime = +scrub.value; show(+scrub.value); };
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { const d = (e.shiftKey ? .1 : 1) * (e.code === 'ArrowRight' ? 1 : -1); audio.currentTime = clamp(audio.currentTime + d, 0, DUR); show(audio.currentTime); }
  });
  window.__ready.then(() => show(Q.has('t') ? +Q.get('t') : 0));
}
