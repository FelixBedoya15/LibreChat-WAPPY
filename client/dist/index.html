        <div class="wappy-splash-status" id="wappy-splash-status" style="display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 12px; font-size: 0.78rem; font-weight: 600; margin-bottom: 18px; transition: opacity 0.25s ease;">
          <span>✨</span>
          <span id="wappy-splash-status-text">Activando a Tenshi y la colmena de 21 especialistas...</span>
        </div>

        <!-- Enlaces Legales Requeridos -->
        <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; font-size: 0.8rem; font-weight: 700;">
          <a href="/privacy" class="wappy-splash-link" style="padding: 6px 14px; border-radius: 10px; text-decoration: none; transition: all 0.2s ease;">Política de Privacidad</a>
          <a href="/terms" class="wappy-splash-link" style="padding: 6px 14px; border-radius: 10px; text-decoration: none; transition: all 0.2s ease;">Condiciones del Servicio</a>
        </div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var stage = document.getElementById('wappy-tenshi-stage');
      var body = document.getElementById('wappy-tenshi-body');
      var halo = document.getElementById('wappy-tenshi-halo');
      var eyeL = document.getElementById('wappy-eye-left');
      var eyeR = document.getElementById('wappy-eye-right');
      var statusText = document.getElementById('wappy-splash-status-text');
      if (!stage || !body || !halo) return;

      var phrases = [
        'Activando a Tenshi y la colmena de 21 especialistas...',
        'Sincronizando normativa SG-SST (Decreto 1072 y Res. 0312)...',
        'Preparando herramientas interactivas y memoria empresarial...',
        '¡Listo para potenciar tu productividad empresarial!'
      ];
      var idx = 0;
      var statusInterval = setInterval(function () {
        if (!document.getElementById('loading-container')) {
          clearInterval(statusInterval);
          return;
        }
        idx = (idx + 1) % phrases.length;
        if (statusText) statusText.textContent = phrases[idx];
      }, 1800);

      // Seguimiento interactivo del cursor / toque sobre Tenshi y su aureola
      document.addEventListener('mousemove', function (e) {
        if (!document.getElementById('loading-container')) return;
        var rect = stage.getBoundingClientRect();
        var cx = rect.left + rect.width / 2;
        var cy = rect.top + rect.height / 2;
        var dx = Math.max(-1, Math.min(1, (e.clientX - cx) / 220));
        var dy = Math.max(-1, Math.min(1, (e.clientY - cy) / 220));
        halo.style.marginLeft = (dx * 8).toFixed(1) + 'px';
        halo.style.marginTop = (dy * 4).toFixed(1) + 'px';
        if (eyeL && eyeR) {
          var ex = (dx * 3.2).toFixed(1);
          var ey = (dy * 2.4).toFixed(1);
          eyeL.style.transform = 'translate(' + ex + 'px, ' + ey + 'px)';
          eyeR.style.transform = 'translate(' + ex + 'px, ' + ey + 'px)';
        }
      }, { passive: true });

      // Reacción al hacer clic / tocar a Tenshi mientras carga
      stage.addEventListener('click', function () {
        body.classList.remove('is-jumping');
        void body.offsetWidth;
        body.classList.add('is-jumping');
        if (statusText) {
          statusText.textContent = '😺 ¡Hola! Soy Tenshi, preparando tu Ecosistema WAPPY IA...';
        }
        var emojis = ['✨', '🐾', '💚', '⚡'];
        for (var i = 0; i < emojis.length; i++) {
          var span = document.createElement('span');
          span.textContent = emojis[i];
          span.style.cssText =
            'position:absolute;font-size:16px;pointer-events:none;z-index:40;left:' +
            (25 + i * 16) +
            '%;top:22%;animation:wappy-particle-rise 0.9s ease-out forwards;';
          stage.appendChild(span);
          setTimeout(function (el) {
            if (el && el.parentNode) el.parentNode.removeChild(el);
          }, 950, span);
        }
      });
    })();
  </script>
</body>

</html>
