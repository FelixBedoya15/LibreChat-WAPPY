  <script>
    try {

      }
      var theme = localStorage.getItem('color-theme') || 'light';
      if (theme === 'saas') {
        document.documentElement.classList.add('saas', 'light');

  <style>
    @keyframes wappy-halo-orbit {
      0%, 100% {
        transform: translateX(-50%) rotateX(68deg) rotateZ(-6deg) translateY(0px) scale(1);
        box-shadow: 0 0 22px rgba(251, 191, 36, 0.95), 0 0 42px rgba(245, 158, 11, 0.45), inset 0 0 12px rgba(251, 191, 36, 0.65);
      }
      25% {
        transform: translateX(-48%) rotateX(64deg) rotateZ(4deg) translateY(-6px) scale(1.06);
      }
      50% {
        transform: translateX(-50%) rotateX(70deg) rotateZ(8deg) translateY(-9px) scale(1.1);
        box-shadow: 0 0 30px rgba(252, 211, 77, 1), 0 0 58px rgba(16, 185, 129, 0.55), inset 0 0 16px rgba(254, 240, 138, 0.85);
      }
      75% {
        transform: translateX(-52%) rotateX(65deg) rotateZ(-3deg) translateY(-5px) scale(1.04);
      }
    }
    @keyframes wappy-halo-spark-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes wappy-tenshi-float {
      0%, 100% { transform: translateY(0px) scaleX(1) scaleY(1); }
      50% { transform: translateY(-7px) scaleX(0.985) scaleY(1.022); }
    }
    @keyframes wappy-tenshi-jump {
      0% { transform: translateY(0) scaleX(1) scaleY(1); }
      25% { transform: translateY(4px) scaleX(1.1) scaleY(0.9); }
      55% { transform: translateY(-16px) scaleX(0.93) scaleY(1.08) rotateZ(-3deg); }
      80% { transform: translateY(2px) scaleX(1.04) scaleY(0.96) rotateZ(2deg); }
      100% { transform: translateY(0) scaleX(1) scaleY(1) rotateZ(0deg); }
    }
    @keyframes wappy-aura-pulse {
      0%, 100% { transform: scale(0.92); opacity: 0.55; }
      50% { transform: scale(1.16); opacity: 0.9; }
    }
    @keyframes wappy-ring-ripple {
      0% { transform: scale(0.8); opacity: 0.65; }
      100% { transform: scale(1.55); opacity: 0; }
    }
    @keyframes wappy-eye-blink {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.12); }
    }
    @keyframes wappy-lens-gleam {
      0%, 60% { transform: translateX(-140%) skewX(-25deg); opacity: 0; }
      70% { opacity: 0.8; }
      85%, 100% { transform: translateX(180%) skewX(-25deg); opacity: 0; }
    }
    @keyframes wappy-progress-shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    @keyframes wappy-dot-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.6; }
    }
    @keyframes wappy-particle-rise {
      0% { transform: translateY(0) scale(0.5); opacity: 0; }
      30% { opacity: 1; }
      100% { transform: translateY(-42px) scale(1.15); opacity: 0; }
    }
    .wappy-tenshi-stage {
      position: relative;
      width: 152px;
      height: 186px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 800px;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .wappy-tenshi-aura {
      position: absolute;
      width: 148px;
      height: 148px;
      border-radius: 9999px;
      background: radial-gradient(circle, rgba(20, 184, 166, 0.32) 0%, rgba(251, 191, 36, 0.18) 48%, rgba(20, 184, 166, 0) 72%);
      animation: wappy-aura-pulse 2.8s infinite ease-in-out;
      pointer-events: none;
    }
    .wappy-tenshi-ripple {
      position: absolute;
      width: 126px;
      height: 126px;
      border-radius: 9999px;
      border: 1.5px solid rgba(20, 184, 166, 0.35);
      animation: wappy-ring-ripple 2.6s infinite cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }
    .wappy-tenshi-halo-wrap {
      position: absolute;
      top: -6px;
      left: 50%;
      width: 84px;
      height: 28px;
      border-radius: 50%;
      border: 3px solid #fde047;
      background: radial-gradient(ellipse at center, rgba(254, 240, 138, 0.35) 0%, rgba(251, 191, 36, 0.08) 70%, transparent 100%);
      animation: wappy-halo-orbit 2.6s infinite ease-in-out;
      transform-origin: center center;
      z-index: 30;
      pointer-events: none;
    }
    .wappy-tenshi-halo-inner {
      position: absolute;
      top: 2px;
      right: 2px;
      bottom: 2px;
      left: 2px;
      border-radius: 50%;
      border: 1.5px dashed rgba(255, 255, 255, 0.85);
      animation: wappy-halo-spark-spin 8s linear infinite;
    }
    .wappy-tenshi-halo-gem {
      position: absolute;
      top: -5px;
      left: 50%;
      width: 8px;
      height: 8px;
      margin-left: -4px;
      border-radius: 9999px;
      background: #ffffff;
      box-shadow: 0 0 12px #fde047, 0 0 20px #10b981;
    }
    .wappy-tenshi-body {
      position: relative;
      width: 132px;
      height: 168px;
      transform-origin: 50% 92%;
      animation: wappy-tenshi-float 3.1s infinite ease-in-out;
      filter: drop-shadow(0 10px 22px rgba(13, 148, 136, 0.32));
      transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1);
      z-index: 20;
    }
    .wappy-tenshi-body.is-jumping {
      animation: wappy-tenshi-jump 0.75s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .wappy-tenshi-img {
      width: 100%;
      height: 100%;
      -o-object-fit: contain;
         object-fit: contain;
      -o-object-position: center;
         object-position: center;
      pointer-events: none;
    }
    .wappy-tenshi-lens {
      position: absolute;
      top: 31.8%;
      width: 25.6%;
      height: 15.2%;
      transform: translate(-50%, -50%);
      border-radius: 48% 48% 54% 54%;
      background: rgba(9, 9, 11, 0.65);
      border: 1px solid rgba(110, 231, 183, 0.65);
      box-shadow: 0 0 10px rgba(52, 211, 153, 0.5), inset 0 0 5px rgba(6, 78, 59, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      pointer-events: none;
    }
    .wappy-tenshi-lens.left { left: 30.7%; }
    .wappy-tenshi-lens.right { left: 68.4%; }
    .wappy-tenshi-lens-gleam {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.32), transparent);
      animation: wappy-lens-gleam 3.4s infinite ease-in-out;
    }
    .wappy-tenshi-eye {
      width: 36%;
      height: 58%;
      border-radius: 9999px;
      background: linear-gradient(180deg, #ffffff 0%, #a7f3d0 45%, #34d399 100%);
      box-shadow: 0 0 8px rgba(52, 211, 153, 0.95);
      position: relative;
      animation: wappy-eye-blink 4.2s infinite ease-in-out;
    }
    .wappy-tenshi-eye::after {
      content: '';
      position: absolute;
      top: 15%;
      right: 16%;
      width: 36%;
      height: 28%;
      border-radius: 9999px;
      background: #ffffff;
    }
    .wappy-progress-track {
      width: 100%;
      max-width: 320px;
      height: 6px;
      border-radius: 9999px;
      background: rgba(148, 163, 184, 0.22);
      overflow: hidden;
      margin: 14px auto 10px;
    }
    .wappy-progress-bar {
      width: 100%;
      height: 100%;
      border-radius: 9999px;
      background: linear-gradient(90deg, #0d9488 0%, #10b981 30%, #fbbf24 55%, #10b981 80%, #0d9488 100%);
      background-size: 200% 100%;
      animation: wappy-progress-shimmer 2.1s linear infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .wappy-tenshi-halo-wrap,
      .wappy-tenshi-halo-inner,
      .wappy-tenshi-body,
      .wappy-tenshi-aura,
      .wappy-tenshi-ripple,
      .wappy-tenshi-eye,
      .wappy-tenshi-lens-gleam {
        animation: none !important;
      }
      .wappy-progress-bar {
        animation-duration: 12s !important;
      }
    }
  </style>
