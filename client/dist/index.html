    if (!localStorage.getItem('wappy_light_default_v2')) {
      localStorage.setItem('wappy_light_default_v2', 'true');
      localStorage.setItem('color-theme', 'light');
    }
    const theme = localStorage.getItem('color-theme') || 'light';
    const effectiveTheme = theme;
    const loadingContainerStyle = document.createElement('style');
    let backgroundColor = '#ffffff';

    if (effectiveTheme === 'dark') {
      backgroundColor = '#0d0d0d';
    } else if (effectiveTheme === 'green') {
      backgroundColor = '#064e3b';
    } else if (effectiveTheme === 'system') {
      const prefersDarkScheme = window.matchMedia('(prefers-color-scheme: dark)').matches;
      backgroundColor = prefersDarkScheme ? '#0d0d0d' : '#ffffff';
    } else {
      backgroundColor = '#ffffff';
    }

    if (effectiveTheme === 'saas') {
      document.documentElement.classList.add('saas', 'light');
    } else {
      document.documentElement.classList.remove('saas');
    }

    loadingContainerStyle.innerHTML = `
        #loading-container {
          display: flex;
          align-items: center;
          justify-content: center;
          height: 100vh;
          background-color: ${backgroundColor};
        }
      `;
    document.head.appendChild(loadingContainerStyle);
  </script>
