<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091824"/>
      <stop offset="100%" stop-color="#0f293d"/>
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes chinTuckMotion {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(-16px); }
      }
      @keyframes arrowPulse {
        0%, 100% { opacity: 0.3; transform: translateX(0); }
        50% { opacity: 1; transform: translateX(-8px); }
      }
      @keyframes waveScan {
        0% { transform: translateY(0); opacity: 0.1; }
        50% { opacity: 0.4; }
        100% { transform: translateY(240px); opacity: 0.1; }
      }
      .head-group {
        animation: chinTuckMotion 3.5s ease-in-out infinite;
        transform-origin: 160px 140px;
      }
      .arrow-track {
        animation: arrowPulse 3.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="320" height="240" rx="12" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid -->
  <line x1="20" y1="60" x2="300" y2="60" stroke="#16384c" stroke-width="0.8" stroke-dasharray="4,4"/>
  <line x1="20" y1="120" x2="300" y2="120" stroke="#16384c" stroke-width="0.8" stroke-dasharray="4,4"/>
  <line x1="20" y1="180" x2="300" y2="180" stroke="#16384c" stroke-width="0.8" stroke-dasharray="4,4"/>

  <!-- Scanning line -->
  <line x1="0" y1="0" x2="320" y2="0" stroke="#14b8a6" stroke-width="1.5" opacity="0.3" style="animation: waveScan 4s linear infinite;"/>

  <!-- Torso & Shoulders (Stable Base) -->
  <path d="M 100 215 C 100 170 135 155 160 155 C 185 155 220 170 220 215 Z" fill="#134e5e" opacity="0.85"/>
  <circle cx="160" cy="155" r="5" fill="#14b8a6" filter="url(#glowCyan)"/>

  <!-- Animated Head & Cervical Spine (Chin Tuck) -->
  <g class="head-group">
    <!-- Neck -->
    <path d="M 152 155 L 152 115 L 168 115 L 168 155 Z" fill="#0d9488" opacity="0.9"/>
    
    <!-- Cervical Target Discs (Under Stress Alleviation) -->
    <circle cx="160" cy="125" r="3.5" fill="#f59e0b" filter="url(#glowCyan)"/>
    <circle cx="160" cy="137" r="3" fill="#f59e0b"/>
    <circle cx="160" cy="148" r="3" fill="#14b8a6"/>

    <!-- Cranium / Head Profile -->
    <ellipse cx="165" cy="85" rx="26" ry="32" fill="#06b6d4" opacity="0.9" filter="url(#glowCyan)"/>
    <!-- Face / Jaw indication facing left -->
    <path d="M 142 85 C 142 98 148 108 158 112" stroke="#e0f2fe" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Eye & ear dots -->
    <circle cx="150" cy="80" r="2.5" fill="#ffffff"/>
    <circle cx="172" cy="86" r="3" fill="#0f766e"/>
  </g>

  <!-- Retraction Movement Indicator Arrows -->
  <g class="arrow-track">
    <path d="M 215 85 L 185 85 M 193 78 L 185 85 L 193 92" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowCyan)"/>
    <text x="218" y="89" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">RETRACCIÓN</text>
  </g>

  <!-- Clinical Badges Overlay -->
  <rect x="14" y="14" width="138" height="22" rx="6" fill="#042f2e" stroke="#0d9488" stroke-width="1"/>
  <text x="22" y="29" fill="#2dd4bf" font-family="monospace" font-size="9" font-weight="bold">CIE-11: FA80 • TECH NECK</text>

  <rect x="14" y="202" width="155" height="24" rx="6" fill="#1e293b" opacity="0.95"/>
  <text x="22" y="218" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">Retracción Cervical Activa</text>

  <rect x="180" y="202" width="126" height="24" rx="6" fill="#0c4a6e" stroke="#0284c7" stroke-width="0.8"/>
  <text x="188" y="218" fill="#7dd3fc" font-family="monospace" font-size="9" font-weight="bold">2x10 reps • 5s c/u</text>
</svg>
