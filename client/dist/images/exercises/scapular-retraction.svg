<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1720"/>
      <stop offset="100%" stop-color="#142838"/>
    </linearGradient>
    <filter id="glowTeal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes scapulaPulse {
        0%, 100% { transform: scaleX(1); }
        50% { transform: scaleX(0.85); }
      }
      @keyframes armExpand {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-12deg); }
      }
      @keyframes armExpandRight {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(12deg); }
      }
      .back-spine {
        animation: scapulaPulse 3.5s ease-in-out infinite;
        transform-origin: 160px 140px;
      }
      .arm-left {
        animation: armExpand 3.5s ease-in-out infinite;
        transform-origin: 110px 120px;
      }
      .arm-right {
        animation: armExpandRight 3.5s ease-in-out infinite;
        transform-origin: 210px 120px;
      }
    </style>
  </defs>

  <rect width="320" height="240" rx="12" fill="url(#bgGrad3)"/>

  <!-- Biomechanical Grid -->
  <line x1="20" y1="60" x2="300" y2="60" stroke="#16384c" stroke-width="0.8" stroke-dasharray="4,4"/>
  <line x1="20" y1="120" x2="300" y2="120" stroke="#16384c" stroke-width="0.8" stroke-dasharray="4,4"/>
  <line x1="20" y1="180" x2="300" y2="180" stroke="#16384c" stroke-width="0.8" stroke-dasharray="4,4"/>

  <!-- Head (Posterior view) -->
  <ellipse cx="160" cy="70" rx="22" ry="26" fill="#0284c7" opacity="0.85"/>

  <!-- Spine Axis -->
  <line x1="160" y1="95" x2="160" y2="200" stroke="#0d9488" stroke-width="3" stroke-dasharray="5,3"/>

  <!-- Scapular Plates (Omóplatos juntándose hacia la columna) -->
  <g class="back-spine">
    <!-- Left Scapula -->
    <path d="M 142 110 L 122 135 L 140 160 Z" fill="#14b8a6" opacity="0.85" filter="url(#glowTeal)"/>
    <!-- Right Scapula -->
    <path d="M 178 110 L 198 135 L 180 160 Z" fill="#14b8a6" opacity="0.85" filter="url(#glowTeal)"/>
    <!-- Convergence Arrows -->
    <path d="M 120 135 L 145 135 M 138 130 L 145 135 L 138 140" stroke="#f59e0b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 200 135 L 175 135 M 182 130 L 175 135 L 182 140" stroke="#f59e0b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Arms in Retraction -->
  <g class="arm-left">
    <path d="M 110 115 L 75 135 L 75 105" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="75" cy="135" r="4" fill="#ffffff"/>
  </g>
  <g class="arm-right">
    <path d="M 210 115 L 245 135 L 245 105" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="245" cy="135" r="4" fill="#ffffff"/>
  </g>

  <!-- Clinical Badges Overlay -->
  <rect x="14" y="14" width="168" height="22" rx="6" fill="#042f2e" stroke="#0d9488" stroke-width="1"/>
  <text x="22" y="29" fill="#2dd4bf" font-family="monospace" font-size="9" font-weight="bold">CIE-11: FB40.1 • ESCAPULAR</text>

  <rect x="14" y="202" width="160" height="24" rx="6" fill="#1e293b" opacity="0.95"/>
  <text x="22" y="218" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">Apertura y Retracción Escapular</text>

  <rect x="182" y="202" width="124" height="24" rx="6" fill="#0c4a6e" stroke="#0284c7" stroke-width="0.8"/>
  <text x="190" y="218" fill="#7dd3fc" font-family="monospace" font-size="9" font-weight="bold">3x8 reps • 5s isom</text>
</svg>
