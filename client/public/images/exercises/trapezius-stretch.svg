<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1724"/>
      <stop offset="100%" stop-color="#15263a"/>
    </linearGradient>
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes neckTiltMotion {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(18deg); }
      }
      @keyframes stretchWave {
        0%, 100% { stroke-dashoffset: 0; opacity: 0.4; }
        50% { stroke-dashoffset: 12; opacity: 1; }
      }
      .head-tilt {
        animation: neckTiltMotion 4s ease-in-out infinite;
        transform-origin: 160px 145px;
      }
      .muscle-fiber {
        animation: stretchWave 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <rect width="320" height="240" rx="12" fill="url(#bgGrad2)"/>
  
  <line x1="20" y1="60" x2="300" y2="60" stroke="#1a3550" stroke-width="0.8" stroke-dasharray="4,4"/>
  <line x1="20" y1="120" x2="300" y2="120" stroke="#1a3550" stroke-width="0.8" stroke-dasharray="4,4"/>
  <line x1="20" y1="180" x2="300" y2="180" stroke="#1a3550" stroke-width="0.8" stroke-dasharray="4,4"/>

  <!-- Torso & Shoulders -->
  <path d="M 90 215 C 90 165 130 150 160 150 C 190 150 230 165 230 215 Z" fill="#1e3a5f" opacity="0.85"/>
  <circle cx="115" cy="175" r="5" fill="#0284c7"/>
  <circle cx="205" cy="175" r="5" fill="#0284c7"/>

  <!-- Elongating Trapezius Muscle Line -->
  <path d="M 125 172 Q 145 135 155 110" stroke="#f59e0b" stroke-width="4" fill="none" stroke-linecap="round" class="muscle-fiber" stroke-dasharray="6,4" filter="url(#glowOrange)"/>

  <!-- Tilting Head Group -->
  <g class="head-tilt">
    <!-- Neck core -->
    <path d="M 153 148 L 153 115 L 167 115 L 167 148 Z" fill="#0d9488" opacity="0.9"/>
    <!-- Head -->
    <ellipse cx="160" cy="85" rx="26" ry="32" fill="#0ea5e9" opacity="0.9" filter="url(#glowOrange)"/>
    <!-- Face features (Frontal tilt) -->
    <circle cx="150" cy="82" r="2.5" fill="#ffffff"/>
    <circle cx="170" cy="82" r="2.5" fill="#ffffff"/>
    <path d="M 155 98 Q 160 102 165 98" stroke="#ffffff" stroke-width="2" fill="none"/>
    <!-- Assisting Hand over Head -->
    <path d="M 188 95 C 195 70 185 52 165 52" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Tension Relief Badges Overlay -->
  <rect x="14" y="14" width="150" height="22" rx="6" fill="#451a03" stroke="#d97706" stroke-width="1"/>
  <text x="22" y="29" fill="#fcd34d" font-family="monospace" font-size="9" font-weight="bold">CIE-10: M54.2 • TRAPECIO</text>

  <rect x="14" y="202" width="168" height="24" rx="6" fill="#1e293b" opacity="0.95"/>
  <text x="22" y="218" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">Estiramiento Lateral de Trapecio</text>

  <rect x="190" y="202" width="116" height="24" rx="6" fill="#042f2e" stroke="#059669" stroke-width="0.8"/>
  <text x="198" y="218" fill="#6ee7b7" font-family="monospace" font-size="9" font-weight="bold">15-20s c/lado</text>
</svg>
