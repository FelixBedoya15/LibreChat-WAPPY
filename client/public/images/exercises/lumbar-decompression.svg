<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b263b"/>
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes spineArch {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-14deg); }
      }
      @keyframes discRelief {
        0%, 100% { r: 3.5; fill: #ef4444; }
        50% { r: 5; fill: #10b981; }
      }
      .upper-torso {
        animation: spineArch 4s ease-in-out infinite;
        transform-origin: 160px 170px;
      }
      .lumbar-disc {
        animation: discRelief 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <rect width="320" height="240" rx="12" fill="url(#bgGrad5)"/>

  <line x1="20" y1="60" x2="300" y2="60" stroke="#1d2d44" stroke-width="0.8" stroke-dasharray="4,4"/>
  <line x1="20" y1="120" x2="300" y2="120" stroke="#1d2d44" stroke-width="0.8" stroke-dasharray="4,4"/>
  <line x1="20" y1="180" x2="300" y2="180" stroke="#1d2d44" stroke-width="0.8" stroke-dasharray="4,4"/>

  <!-- Office Chair Silhouette -->
  <path d="M 120 185 L 195 185 L 195 195 L 120 195 Z" fill="#334155"/>
  <path d="M 120 120 L 128 120 L 128 185 L 120 185 Z" fill="#334155"/>
  <line x1="155" y1="195" x2="155" y2="225" stroke="#475569" stroke-width="6"/>

  <!-- Lower Pelvis & Legs (Sitting) -->
  <ellipse cx="160" cy="180" rx="20" ry="10" fill="#0369a1"/>
  <!-- Thighs extending forward -->
  <path d="M 160 178 L 210 178 L 210 215" stroke="#0284c7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Upper Torso & Spine (Arching Backwards for Decompression) -->
  <g class="upper-torso">
    <!-- Spine column -->
    <path d="M 160 170 Q 155 130 160 100" stroke="#0d9488" stroke-width="5" fill="none"/>
    <!-- Head -->
    <ellipse cx="160" cy="78" rx="20" ry="24" fill="#38bdf8"/>
    <!-- Shoulders -->
    <circle cx="160" cy="108" r="7" fill="#0284c7"/>
    <!-- Hands on Lower Back (McKenzie support) -->
    <circle cx="148" cy="158" r="5" fill="#f59e0b"/>
  </g>

  <!-- L4-L5 Lumbar Disc Indicator with Pulsing Relief -->
  <circle cx="158" cy="160" class="lumbar-disc" filter="url(#glowGreen)"/>

  <!-- Decompression Arrows -->
  <path d="M 145 135 L 130 115 M 130 125 L 130 115 L 140 115" stroke="#10b981" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Clinical Badges Overlay -->
  <rect x="14" y="14" width="168" height="22" rx="6" fill="#052e16" stroke="#16a34a" stroke-width="1"/>
  <text x="22" y="29" fill="#4ade80" font-family="monospace" font-size="9" font-weight="bold">CIE-11: FA81 • LUMBALGIA L4-L5</text>

  <rect x="14" y="202" width="165" height="24" rx="6" fill="#1e293b" opacity="0.95"/>
  <text x="22" y="218" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">Extensión Lumbar en Silla</text>

  <rect x="186" y="202" width="120" height="24" rx="6" fill="#042f2e" stroke="#059669" stroke-width="0.8"/>
  <text x="194" y="218" fill="#6ee7b7" font-family="monospace" font-size="9" font-weight="bold">5 reps • 5s c/90m</text>
</svg>
